<title>AI 刷题 · 离线题库</title>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#101828; --sub:#667085; --line:#e6e8ee;
  --pri:#2563eb; --pri-soft:#e8f0fe; --ok:#0f9d58; --ok-soft:#e6f6ec; --bad:#d92d20; --bad-soft:#fdeceb;
  --warn:#b54708; --warn-soft:#fef3e2;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1115; --card:#171a21; --ink:#e8eaf0; --sub:#98a2b3; --line:#242832;
    --pri:#5b93ff; --pri-soft:#18233a; --ok:#3ddc84; --ok-soft:#12251a; --bad:#ff6b6b; --bad-soft:#2a1616;
    --warn:#f0b562; --warn-soft:#2a2114; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.top{padding:calc(14px + env(safe-area-inset-top)) 0 6px;display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--sub);font-size:13px;margin-top:2px}
.ico{width:34px;height:34px;border-radius:11px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600;letter-spacing:.3px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.metrics .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.metrics .l{font-size:12px;color:var(--sub);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;
  padding:8px 14px;font-size:14px;line-height:1.2;min-height:36px;display:inline-flex;align-items:center}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.mut{color:var(--sub)}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:600;
  background:var(--pri);color:#fff;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card);color:var(--pri);border:1px solid var(--line)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.sm{padding:10px 14px;font-size:14px;min-height:40px;flex:none;border-radius:11px}
.btn:disabled{opacity:.45}
.entry{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.entry:last-child{border-bottom:0}
.entry .em{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--pri-soft);color:var(--pri);font-weight:600}
.entry .t{flex:1}
.entry .d{color:var(--sub);font-size:13px}
.entry .go{color:var(--sub);font-size:18px}
.badge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:600;letter-spacing:.2px}
.badge.b2{background:#f3e8ff;color:#7e22ce}
.badge.b3{background:#e0f2f1;color:#00695c}
.badge.b4{background:var(--warn-soft);color:var(--warn)}
.badge.b5{background:#fce7f3;color:#be185d}
.badge.b6{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme:dark){
 .badge.b2{background:#221633;color:#c4a2f0}.badge.b3{background:#12251f;color:#5fd6b8}
 .badge.b5{background:#2b1622;color:#f0a0c4}
}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  display:flex;box-shadow:0 -2px 14px rgba(16,24,40,.06)}
.tabbar a{flex:1;text-decoration:none;color:var(--sub);font-size:11px;padding:9px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;justify-content:center}
.tabbar a.on{color:var(--pri)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qhead{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.qhead .back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px}
.qhead .pos{flex:1;font-size:14px;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.qhead .star{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:18px}
.qhead .star.on{color:#f5a524;border-color:#f5d08a;background:var(--warn-soft)}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .25s}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qmeta .k{font-size:12px;color:var(--sub)}
.stem{font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:6px 0 14px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.55;
  color:var(--ink);min-height:52px}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);margin-top:1px}
.opt .t{flex:1;word-break:break-word}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{opacity:1}
.fillbox{display:flex;gap:8px;margin-top:4px}
.fillbox input{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;
  background:var(--card);color:var(--ink);min-height:50px;outline:none}
.fillbox input:focus{border-color:var(--pri)}
.textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:16px;line-height:1.6;background:var(--card);color:var(--ink);resize:vertical;outline:none;
  font-family:inherit}
textarea:focus{border-color:var(--pri)}
.feedback{margin-top:16px;border-radius:16px;padding:14px;background:var(--card);border:1.5px solid var(--line)}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback.info{border-color:var(--pri);background:var(--pri-soft)}
.fb-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.fb-title.ok{color:var(--ok)} .fb-title.bad{color:var(--bad)} .fb-title.info{color:var(--pri)}
.fb-ans{margin-top:8px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.fb-ans b{font-weight:600}
.fb-exp{margin-top:10px;font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  border-top:1px dashed var(--line);padding-top:10px}
.fb-exp .h{display:block;color:var(--sub);font-size:12px;font-weight:600;margin-bottom:4px;letter-spacing:.3px}
.fb-src{margin-top:10px;font-size:12px;color:var(--sub)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{min-height:48px}
.list .item{display:flex;gap:10px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .body{flex:1;min-width:0}
.list .s{font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.list .m{font-size:12px;color:var(--sub);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:36px 12px;line-height:1.8}
.statbar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.statbar .nm{width:64px;color:var(--sub);font-size:13px;flex:none}
.statbar .tr{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.statbar .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.statbar .vl{width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.chart .col i{width:100%;max-width:26px;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;display:block}
.chart .col span{font-size:11px;color:var(--sub)}

,"options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"《个人信息保护法》第五条规定处理个人信息应遵循合法、正当、必要和诚信原则，必要原则即最小必要。","kp":"1.4","score":1.0,"difficulty":"基础"},{"id":"145","bank":"基础理论","code":"BAS-TF-035","type":"判断题","stem":"关键信息基础设施的认定由企业自行决定。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"关键信息基础设施的认定由相关保护工作部门负责，企业不能自行认定。","kp":"1.4","score":1.0,"difficulty":"基础"},{"id":"146","bank":"基础理论","code":"BAS-TF-036","type":"判断题","stem":"《网络安全审查办法》适用于所有网络产品采购行为。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"《网络安全审查办法》主要适用于关键信息基础设施运营者采购网络产品和服务，以及平台运营者数据出境等特定情形。","kp":"1.4","score":1.0,"difficulty":"基础"},{"id":"147","bank":"基础理论","code":"BAS-TF-037","type":"判断题","stem":"GB/T 41867是人工智能术语标准。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"GB/T 41867-2022《信息技术 人工智能 术语》规定了人工智能领域的术语和定义。","kp":"1.6","score":1.0,"difficulty":"基础"},{"id":"148","bank":"基础理论","code":"BAS-TF-038","type":"判断题","stem":"GB 45438是人工智能内容标识相关标准，GB/T 22239是网络安全等级保护基本要求标准。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"GB 45438规定了人工智能生成内容的标识要求，GB/T 22239规定了网络安全等级保护的基本安全要求。","kp":"1.6","score":1.0,"difficulty":"基础"},{"id":"149","bank":"基础理论","code":"BAS-TF-039","type":"判断题","stem":"根据62号令，播出事故分为重大、严重和一般三个等级。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"《广播电视安全播出管理规定》（62号令）将播出事故分为重大播出事故、严重播出事故和一般播出事故三个等级。","kp":"1.5","score":1.0,"difficulty":"基础"},{"id":"150","bank":"基础理论","code":"BAS-TF-040","type":"判断题","stem":"生成式人工智能隐式标识是指通过文字提示在内容中明显标注人工智能生成。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"隐式标识是通过数字水印等不可见方式嵌入标识，显式标识才是通过文字或图形等可见方式标注。","kp":"2.3","score":1.0,"difficulty":"基础"},{"id":"151","bank":"基础理论","code":"BAS-SA-001","type":"简答题","stem":"简述人工智能、机器学习、深度学习三者之间的关系。","options":[],"answer":"（1）人工智能是使计算机模拟人类智能行为的广义概念，是最外层范畴。（1分）\n（2）机器学习是人工智能的一个子领域，通过数据驱动的方式让模型自动学习规律，而非依赖人工编程规则。（1分）\n（3）深度学习是机器学习的一个分支，以深层神经网络为基础，通过多层非线性变换从数据中学习特征表示。（1分）\n（4）三者为包含关系：人工智能包含机器学习，机器学习包含深度学习。（2分）","answerSource":"源库","answerNote":"","explanation":"","kp":"1.1","score":5.0,"difficulty":"基础"},{"id":"152","bank":"基础理论","code":"BAS-SA-002","type":"简答题","stem":"简述大模型训练的三个主要阶段及其各自目标。","options":[],"answer":"（1）预训练：利用大规模无标注文本数据，通过自监督学习让模型掌握语言规律和世界知识。（2分）\n（2）指令微调（监督微调）：使用标注好的指令数据对模型进行微调，使其学会遵循指令完成具体任务。（1.5分）\n（3）偏好对齐：通过人类偏好数据对模型进行训练，使模型输出更符合人类价值观和预期，减少有害内容生成。（1.5分）","answerSource":"源库","answerNote":"","explanation":"","kp":"1.2","score":5.0,"difficulty":"基础"},{"id":"153","bank":"基础理论","code":"BAS-SA-003","type":"简答题","stem":"简述RAG（检索增强生成）的基本原理和适用场景。","options":[],"answer":"基本原理：（3分）\n（1）将外部知识库中的文档进行向量化并存储到向量数据库中。\n（2）用户提问时，先通过检索从知识库中召回相关文档片段。\n（3）将检索到的文档片段与用户问题拼接，作为大模型的输入上下文。\n（4）大模型基于检索到的上下文生成回答。\n适用场景：（2分）\n（1）需要准确事实知识的专业问答场景。\n（2）知识频繁更新、难以通过训练嵌入模型的场景。\n（3）需要引用来源、可追溯的场景。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.3/2.1","score":5.0,"difficulty":"基础"},{"id":"154","bank":"基础理论","code":"BAS-SA-004","type":"简答题","stem":"简述《生成式人工智能服务管理暂行办法》对服务提供者的主要义务要求。","options":[],"answer":"（1）依法开展预训练和优化训练等数据处理活动，使用合法来源的数据。（1分）\n（2）采取有效措施防范未成年人过度依赖。（1分）\n（3）提供具有舆论属性或社会动员能力的生成式人工智能服务前，应按规定开展安全评估并履行算法备案手续。（1分）\n（4）对生成内容进行标识。（0.5分）\n（5）承担网络信息内容生产者责任，履行个人信息保护义务。（1分）\n（6）发现违法内容应及时采取处置措施并向主管部门报告。（0.5分）","answerSource":"源库","answerNote":"","explanation":"","kp":"1.4","score":5.0,"difficulty":"基础"},{"id":"155","bank":"基础理论","code":"BAS-SA-005","type":"简答题","stem":"简述人工智能应用接入制播系统的安全播出保障要求。","options":[],"answer":"（1）系统可靠性：人工智能应用应具备容错和冗余机制，避免单点故障影响播出。（1分）\n（2）数据安全：制播相关数据应按规定进行保护，防止数据泄露和篡改。（1分）\n（3）应急处置：应制定人工智能服务故障的应急预案，确保在人工智能系统异常时能够及时切换到备用方案。（1分）\n（4）权限管理：严格限制人工智能应用对制播系统的访问权限，遵循最小权限原则。（1分）\n（5）测试验证：人工智能应用上线前应进行充分测试，确保不影响现有制播流程和安全播出。（1分）","answerSource":"源库","answerNote":"","explanation":"","kp":"1.5","score":5.0,"difficulty":"基础"},{"id":"156","bank":"基础理论","code":"BAS-SA-006","type":"简答题","stem":"简述GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》的主要规范内容。","options":[],"answer":"（1）该标准规定了生成式人工智能服务安全的基本要求。（1分）\n（2）涵盖训练数据和优化训练数据的安全规范。（1分）\n（3）包括模型安全要求，涉及生成内容安全等方面。（1分）\n（4）规定了服务提供者在安全措施方面的要求，如内容过滤、安全评估等。（1分）\n（5）为生成式人工智能服务提供者开展安全建设和评估提供技术依据。（1分）","answerSource":"源库","answerNote":"","explanation":"","kp":"1.6","score":5.0,"difficulty":"基础"},{"id":"157","bank":"基础理论","code":"BAS-SA-007","type":"简答题","stem":"简述智能体的基本原理及其核心能力。","options":[],"answer":"基本原理：（2分）\n智能体是以大模型为决策核心，能够感知环境、规划任务、调用工具并执行行动的系统。\n核心能力：（3分）\n（1）任务规划：将用户需求分解为可执行的步骤序列。\n（2）工具调用：根据任务需要调用外部工具或API获取信息、执行操作。\n（3）记忆管理：维护短期和长期记忆，支持多轮对话中的上下文管理。\n（4）多轮交互：与用户进行多轮对话，根据反馈调整行动策略。","answerSource":"源库","answerNote":"","explanation":"","kp":"2.1","score":5.0,"difficulty":"基础"},{"id":"158","bank":"基础理论","code":"BAS-SA-008","type":"简答题","stem":"简述模型越狱和提示词注入的基本概念及防范措施。","options":[],"answer":"基本概念：（2分）\n（1）模型越狱：通过特殊提示词绕过模型的安全对齐机制，诱导模型产生违规或有害输出。\n（2）提示词注入：在输入中嵌入恶意指令，试图改变模型的行为或获取未经授权的信息。\n防范措施：（3分）\n（1）加强输入过滤和内容检测。\n（2）在系统提示中设置明确的安全边界。\n（3）对模型输出进行安全检查和过滤。\n（4）定期进行红队测试和安全评估。\n（5）建立日志审计机制，及时发现异常调用行为。","answerSource":"源库","answerNote":"","explanation":"","kp":"2.2","score":5.0,"difficulty":"基础"},{"id":"159","bank":"基础理论","code":"BAS-SA-009","type":"简答题","stem":"简述人工智能智能审核系统中人工审核与人工智能审核的协同机制。","options":[],"answer":"（1）分层审核：人工智能审核作为第一层，对内容进行初步筛选和分类；人工审核作为第二层，对人工智能审核标记的高风险内容进行复核。（1.5分）\n（2）人机协同：人工智能负责大规模内容的快速处理，人工负责复杂、模糊或高风险内容的判定。（1分）\n（3）反馈优化：人工审核结果反馈给人工智能系统，用于持续优化审核模型。（0.5分）\n（4）风险控制：对人工智能审核的误判和漏判进行监控，动态调整人工智能与人工的审核分工比例。（1分）\n（5）能力边界：明确人工智能审核的能力边界，对超出其判断能力的内容由人工审核处理。（1分）","answerSource":"源库","answerNote":"","explanation":"","kp":"2.3.2","score":5.0,"difficulty":"基础"},{"id":"160","bank":"基础理论","code":"BAS-SA-010","type":"简答题","stem":"简述行业训练数据集建设的基本要求。","options":[],"answer":"（1）数据来源合规：确保数据来源合法，取得必要授权，遵守相关法律法规要求。（1分）\n（2）标注质量管控：建立标注规范和质检流程，确保标注数据的准确性和一致性。（1分）\n（3）版权保护：对涉及版权的数据进行审查，避免侵犯他人知识产权。（1分）\n（4）数据安全：对训练数据进行分级分类管理，保护个人信息和敏感数据。（0.5分）\n（5）数据多样性：覆盖行业典型场景，保证数据的代表性和多样性。（0.5分）\n（6）持续更新：建立数据更新机制，保持训练数据的时效性。（1分）","answerSource":"源库","answerNote":"","explanation":"","kp":"2.3.6","score":5.0,"difficulty":"基础"},{"id":"161","bank":"基础理论","code":"BAS-SA-011","type":"简答题","stem":"简述精确率和召回率的定义及二者之间的关系。","options":[],"answer":"精确率是指在所有被预测为正类的样本中，实际为正类的比例，计算公式为TP/(TP+FP)。\n召回率是指在所有实际为正类的样本中，被正确预测为正类的比例，计算公式为TP/(TP+FN)。\n二者之间通常存在权衡关系：提高精确率可能降低召回率，反之亦然。在实际应用中需要根据具体场景选择合适的平衡点，例如医疗诊断中更重视召回率（尽量不漏诊），垃圾邮件过滤中更重视精确率（尽量不误判正常邮件）。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.1","score":5.0,"difficulty":"基础"},{"id":"162","bank":"基础理论","code":"BAS-SA-012","type":"简答题","stem":"简述Transformer编码器的结构和各组件作用。","options":[],"answer":"Transformer编码器由多层堆叠而成，每层包含两个子层：\n（1）多头自注意力层：通过多个注意力头并行计算输入序列中各位置之间的关联关系，使模型能够关注序列中不同位置的信息。\n（2）前馈神经网络层：对注意力层的输出进行非线性变换，增强模型的表达能力。\n每个子层之后接残差连接和层归一化操作，用于稳定训练过程。编码器的输入经过词嵌入和位置编码处理后送入各层。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.2","score":5.0,"difficulty":"基础"},{"id":"163","bank":"基础理论","code":"BAS-SA-013","type":"简答题","stem":"简述知识蒸馏的基本原理和流程。","options":[],"answer":"知识蒸馏是一种模型压缩技术，基本原理是将大模型（教师模型）的知识迁移到小模型（学生模型），使学生模型在参数量较小的情况下获得接近教师模型的性能。\n流程包括以下步骤：\n（1）训练教师模型：使用标注数据训练大模型至收敛。\n（2）生成软标签：使用教师模型对训练数据进行预测，输出概率分布作为软标签。\n（3）训练学生模型：学生模型同时学习硬标签（真实标签）和软标签（教师模型输出），通过蒸馏损失函数优化。\n（4）部署学生模型：将训练完成的小模型部署到实际应用环境。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.2","score":5.0,"difficulty":"基础"},{"id":"164","bank":"基础理论","code":"BAS-SA-014","type":"简答题","stem":"简述RAG（检索增强生成）的完整流程。","options":[],"answer":"RAG的完整流程包括以下五个步骤：\n（1）文档切分：将原始文档按照一定规则切分为合适大小的文本块。\n（2）向量化：使用嵌入模型将文本块转换为向量表示，并存入向量数据库。\n（3）检索：将用户查询转换为向量，在向量数据库中检索最相关的文本块。\n（4）增强：将检索到的相关文本块与用户查询拼接，构造增强提示。\n（5）生成：将增强提示输入大语言模型，生成最终回答。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.3","score":5.0,"difficulty":"基础"},{"id":"165","bank":"基础理论","code":"BAS-SA-015","type":"简答题","stem":"简述边缘部署的特点和适用场景。","options":[],"answer":"边缘部署的特点包括：\n（1）降低延迟：在终端设备上直接运行模型，减少数据传输时间。\n（2）保护隐私：数据无需上传至云端，降低数据泄露风险。\n（3）减少带宽依赖：减少与云端之间的数据传输量。\n（4）离线可用：在网络不可用时仍可运行。\n适用场景包括实时语音识别、本地图像处理、智能终端交互、隐私敏感场景下的数据处理等。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.3","score":5.0,"difficulty":"基础"},{"id":"166","bank":"基础理论","code":"BAS-SA-016","type":"简答题","stem":"简述《数据安全法》的核心制度。","options":[],"answer":"《数据安全法》确立的核心制度包括：\n（1）数据分类分级保护制度：根据数据在经济社会发展中的重要程度以及遭到篡改、破坏、泄露或非法利用后对国家安全、公共利益或个人及组织合法权益造成的危害程度，对数据实行分类分级保护。\n（2）数据安全风险评估制度：定期开展数据安全风险评估并提交报告。\n（3）数据安全应急处理机制：建立数据安全事件应急处理机制。\n（4）数据安全审查制度：对影响或可能影响国家安全的数据处理活动进行国家安全审查。\n（5）数据出口管制：对属于管制物项的数据依法实施出口管制。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.4","score":5.0,"difficulty":"基础"},{"id":"167","bank":"基础理论","code":"BAS-SA-017","type":"简答题","stem":"简述《个人信息保护法》的基本原则。","options":[],"answer":"《个人信息保护法》规定的基本原则包括：\n（1）合法、正当、必要和诚信原则：处理个人信息应当有合法基础，遵循正当目的，限于必要范围。\n（2）目的明确原则：处理个人信息应当具有明确、合理的目的。\n（3）最小必要原则：收集个人信息应限于实现处理目的的最小范围。\n（4）公开透明原则：公开个人信息处理规则，明示处理目的、方式和范围。\n（5）质量原则：保证个人信息的准确性、完整性。\n（6）安全保护原则：采取必要措施保障个人信息安全。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.4","score":5.0,"difficulty":"基础"},{"id":"169","bank":"基础理论","code":"BAS-SA-019","type":"简答题","stem":"简述少样本提示和思维链提示的区别。","options":[],"answer":"少样本提示：在提示中给出少量输入输出示例，引导模型理解任务模式并生成正确结果。优点是简单直接，适合分类、翻译等明确映射任务。缺点是需要构造高质量示例，且示例数量有限时效果不稳定。\n思维链提示：引导模型逐步展开推理过程，先输出中间推理步骤，再得出最终结论。优点是适合复杂数学推理、逻辑分析等需要多步思考的任务，可提高推理准确性。缺点是输出较长，消耗更多token，推理速度较慢。\n两者可以结合使用，在少样本示例中展示思维链推理过程，兼顾任务理解和逐步推理的优势。","answerSource":"源库","answerNote":"","explanation":"","kp":"2.1","score":5.0,"difficulty":"基础"},{"id":"170","bank":"基础理论","code":"BAS-SA-020","type":"简答题","stem":"简述对抗样本攻击和后门攻击的区别。","options":[],"answer":"对抗样本攻击：在推理阶段通过向输入添加精心设计的微小扰动，使模型产生错误判断。攻击者不需要修改模型本身，属于推理阶段攻击。特点是扰动通常难以被人眼察觉，但能显著改变模型输出。\n后门攻击：在训练阶段通过在训练数据中植入带有触发器的样本，使模型在正常输入时表现正常，但当输入包含特定触发器时产生攻击者指定的错误输出。属于训练阶段攻击，隐蔽性强。\n主要区别：攻击时机不同（对抗样本在推理阶段，后门在训练阶段）；攻击方式不同（对抗样本修改输入，后门修改训练数据和模型参数）；防御手段不同（对抗样本可通过对抗训练防御，后门需要检测训练数据和模型参数）。","answerSource":"源库","answerNote":"","explanation":"","kp":"2.2","score":5.0,"difficulty":"基础"},{"id":"171","bank":"基础理论","code":"BAS-CA-001","type":"综合题","stem":"某广播电视机构计划建设基于大模型的智能问答系统，用于内部知识检索和政策咨询。请结合大模型应用技术相关知识，回答以下问题。 （1）该系统应选择哪种技术方案（提示词工程、RAG、微调或智能体编排）？说明理由。（4分） （2）系统部署方式应如何选择？需要考虑哪些因素？（3分） （3）如何保障系统输出内容的安全性和准确性？（3分）","options":[],"answer":"（1）技术方案选择：（4分）\n推荐采用RAG（检索增强生成）方案。\n理由：内部知识库内容频繁更新，RAG可以动态检索最新文档，无需重新训练模型；政策咨询场景需要准确的来源引用，RAG可提供可追溯的参考文档；相比微调，RAG建设成本更低、迭代更快，适合知识检索类场景。\n（2）部署方式选择：（3分）\n考虑到广播电视机构对数据安全和信息保密的要求，建议采用本地私有化部署方式。需要考虑的因素包括：数据安全要求、算力资源可用性、模型性能需求、运维能力、预算限制、合规要求等。\n（3）安全保障措施：（3分）\n建立输出内容过滤机制；设置知识库访问权限控制；建立结果复核机制；记录调用日志便于审计；定期进行安全评估和测试。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.2/1.3/2.1/2.3.6","score":10.0,"difficulty":"基础"},{"id":"172","bank":"基础理论","code":"BAS-CA-002","type":"综合题","stem":"某省级广播电视台拟在新闻节目中引入人工智能虚拟数字人进行辅助播报。请结合相关法规标准和技术知识，分析该应用需要满足的合规要求和技术保障措施。","options":[],"answer":"合规要求：（5分）\n（1）根据《互联网信息服务深度合成管理规定》和《人工智能生成合成内容标识办法》，使用人工智能虚拟数字人生成的内容应添加显式标识和隐式标识。（1.5分）\n（2）根据GB 45438-2025《人工智能生成合成内容标识要求》，确保标识符合强制性国家标准的技术要求。（1分）\n（3）根据《生成式人工智能服务管理暂行办法》，服务提供者应承担内容生产者责任，确保生成内容合法合规。（1分）\n（4）涉及新闻内容应符合新闻宣传管理相关规定，不得使用人工智能虚拟数字人编造虚假新闻。（1分）\n（5）根据《广播电视安全播出管理规定》，接入制播系统应满足安全播出保障要求。（0.5分）\n技术保障措施：（5分）\n（1）安全播出保障：人工智能数字人系统应具备冗余和容错机制，制定故障应急预案，确保不影响正常播出。（1.5分）\n（2）内容审核：人工智能生成内容应经过审核后方可播出。（1分）\n（3）系统安全：对人工智能数字人系统进行安全测试，防止被恶意利用。（1分）\n（4）权限管理：严格控制人工智能数字人系统的操作权限。（0.5分）\n（5）标识管理：确保人工智能生成内容按规定进行标识。（1分）","answerSource":"源库","answerNote":"","explanation":"","kp":"1.4/1.5/1.6/2.3.1/2.3.6","score":10.0,"difficulty":"基础"},{"id":"173","bank":"基础理论","code":"BAS-CA-003","type":"综合题","stem":"某广播电视机构在制播系统中引入了人工智能辅助内容审核系统。请分析该系统可能存在的安全风险，并提出相应的安全管控措施。","options":[],"answer":"安全风险：（5分）\n（1）审核模型被规避风险：恶意用户可能通过特殊手段绕过人工智能审核模型。（1分）\n（2）误判和漏判风险：人工智能审核可能对某些内容判断不准，导致违规内容漏审或合规内容误判。（1分）\n（3）数据安全风险：审核过程中涉及的节目内容、用户数据等可能泄露。（1分）\n（4）系统依赖风险：过度依赖人工智能审核可能导致人工审核能力弱化。（1分）\n（5）模型安全风险：模型可能被对抗样本攻击或提示词注入攻击。（1分）\n安全管控措施：（5分）\n（1）建立人机协同审核机制，人工智能审核与人工审核相互补充。（1分）\n（2）实施权限控制和沙箱隔离，限制审核系统的访问范围。（1分）\n（3）建立日志审计机制，记录审核过程和结果。（0.5分）\n（4）定期对审核模型进行测试评估和持续优化。（1分）\n（5）制定应急处置预案，在人工智能审核系统故障时能够及时切换到人工审核。（1分）\n（6）建立输出过滤和复核机制，对人工智能审核结果进行二次校验。（0.5分）","answerSource":"源库","answerNote":"","explanation":"","kp":"2.2/2.3.2/2.3.5","score":10.0,"difficulty":"基础"},{"id":"174","bank":"基础理论","code":"BAS-CA-004","type":"综合题","stem":"结合人工智能安全治理相关法规和标准，论述广播电视机构在人工智能应用中应如何建立安全管理体系。","options":[],"answer":"（1）制度建设：（2分）\n依据《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》《关键信息基础设施安全保护条例》等法律法规，以及《生成式人工智能服务管理暂行办法》《人工智能安全治理框架》2.0版等专项规范，建立人工智能应用安全管理制度。制定模型选型、数据管理、内容审核、应急处置等具体规范。\n（2）技术保障：（2分）\n依据GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》落实生成式人工智能服务安全基本要求，包括训练数据安全、模型安全、内容安全等方面。依据GB/T 22239-2019落实网络安全等级保护要求。依据GB/T 45225-2025开展深度学习算法评估。\n（3）数据安全：（2分）\n依据GB/T 43697-2024进行数据分类分级管理，确保训练数据来源合规，保护个人信息和敏感数据。建立数据全生命周期管理机制。\n（4）内容标识：（1分）\n依据GB 45438-2025和《人工智能生成合成内容标识办法》，对人工智能生成合成内容添加显式和隐式标识，支持内容溯源。\n（5）安全评估：（2分）\n建立人工智能应用风险评估、测试评估和持续整改机制。定期开展安全评估，及时发现问题并整改。加强人员安全培训，明确安全责任分工，建立安全事件报告和响应机制。\n（6）行业适配：（1分）\n遵循行业模型选型基本原则，确保内容安全与合规优先、供应链自主可控、能力与场景适配，明确行业人工智能应用的负面行为边界。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.4/1.6/2.2/2.3.5/2.3.6","score":10.0,"difficulty":"基础"},{"id":"175","bank":"基础理论","code":"BAS-CA-005","type":"综合题","stem":"某广播电视机构计划构建行业大模型应用平台，需要同时支撑内容生产辅助、智能媒资检索和智慧运维三类场景。请综合分析该平台的技术架构设计、模型适配路径选择和安全保障方案。","options":[],"answer":"技术架构设计：（3分）\n（1）基础设施层：统筹算力资源规划，采用自建与租用相结合的模式，优先适配国产算力。合理配置GPU、NPU等计算资源，满足多场景并发需求。\n（2）模型服务层：通过统一网关接入大模型服务，支持API调用和本地私有化部署两种方式，根据场景需求灵活选择。\n（3）数据层：建设行业训练数据集和知识库，实施分级分类管理，确保数据来源合规。\n（4）应用层：面向内容生产辅助、智能媒资检索、智慧运维三类场景分别构建应用模块。\n模型适配路径选择：（3分）\n（1）内容生产辅助：采用提示词工程结合RAG方式，检索行业知识库辅助脚本创作和分镜设计，通过约束输出和结果校核降低输出风险。（1分）\n（2）智能媒资检索：采用RAG方案，通过向量检索实现媒资内容的语义搜索和智能编目，辅助标签提取和版权识别。（1分）\n（3）智慧运维：采用智能体编排方式，集成故障诊断工具和监控系统，实现异常检测、故障诊断和播出链路监控的自动化。（1分）\n安全保障方案：（4分）\n（1）模型安全：选择经过安全评估的模型，定期进行安全测试，防范模型越狱和提示词注入风险。（1分）\n（2）数据安全：建立数据分级分类制度，训练数据来源合规，保护制播数据安全，防范训练数据投毒和数据污染。（1分）\n（3）权限管理：实施最小权限原则，不同场景设置不同的访问权限，建立日志审计机制。（1分）\n（4）内容安全：对人工智能生成内容进行审核和标识，确保符合安全播出要求，制定人工智能服务故障应急预案，确保制播业务连续性。（1分）","answerSource":"源库","answerNote":"","explanation":"","kp":"2.1/2.2/2.3/2.3.6","score":10.0,"difficulty":"基础"},{"id":"176","bank":"基础理论","code":"BAS-CA-006","type":"综合题","stem":"某广播电视机构计划建设基于大语言模型的智能问答系统，需要处理海量历史稿件数据。 说明RAG技术在此场景中的适用性及完整流程。（5分） 对比RAG与模型微调两种方案的优劣，说明选择RAG的理由。（5分）","options":[],"answer":"RAG技术适用于此场景，原因如下：历史稿件数量庞大且持续更新，RAG无需重新训练模型即可更新知识库；问答系统需要引用具体稿件来源，RAG可提供检索溯源能力。\n完整流程： ①文档切分：将历史稿件按段落或语义切分为文本块。 ②向量化：使用嵌入模型将文本块转换为向量，存入向量数据库。 ③检索：将用户问题向量化，在向量数据库中检索相关文本块。 ④增强：将检索到的文本块与用户问题拼接构造提示。 ⑤生成：大语言模型基于增强提示生成回答。\nRAG与模型微调的对比：\nRAG优势：知识更新便捷（仅需更新向量数据库）；可追溯信息来源；无需重新训练模型，部署成本较低；适合知识频繁变化的场景。\n模型微调优势：模型深度学习领域知识；输出风格更一致；推理时无需检索步骤。\n选择RAG的理由：广播电视机构的稿件每日更新，知识库需要频繁刷新，RAG可即时更新知识而无需重新训练；问答系统需要提供准确的信息来源引用，RAG天然支持溯源；训练大模型的计算资源成本高，RAG方案更具经济性。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.3/2.1","score":10.0,"difficulty":"基础"},{"id":"177","bank":"基础理论","code":"BAS-CA-007","type":"综合题","stem":"某媒体机构在部署人工智能内容审核系统时需要评估安全风险。 列举三种常见的人工智能安全攻击方式并简述其原理。（5分） 针对上述攻击，分别提出对应的防护措施。（5分）","options":[],"answer":"三种常见攻击方式：\n①对抗样本攻击：在推理阶段向输入数据添加精心设计的微小扰动，使模型产生错误判断。例如对图像添加不可见噪声使审核模型误判内容类别。\n②后门攻击：在训练阶段向训练数据中植入带有触发器的样本，模型在正常输入时表现正常，但遇到特定触发器时产生错误输出。例如在审核模型中植入后门，使含有特定标记的内容被判定为合规。\n③数据投毒：向训练数据集中注入恶意构造的样本，破坏模型训练过程，导致模型性能下降或在特定场景下产生错误行为。\n对应防护措施：\n①针对对抗样本攻击：采用对抗训练，在训练数据中加入对抗样本提升模型鲁棒性；部署输入异常检测模块，识别可疑输入。\n②针对后门攻击：对训练数据和模型参数进行后门检测，使用异常样本识别算法筛查可疑训练样本；从可信来源获取训练数据。\n③针对数据投毒：建立数据清洗和验证流程，对训练数据进行质量检查和异常检测；使用数据来源追踪机制，确保训练数据可信。\n此外，还可通过沙箱隔离运行模型、实施输出过滤和日志审计等通用安全措施，构建多层防护体系。","answerSource":"源库","answerNote":"","explanation":"","kp":"2.2/1.4","score":10.0,"difficulty":"基础"},{"id":"178","bank":"基础理论","code":"BAS-CA-008","type":"综合题","stem":"某媒体机构计划应用生成式人工智能（AIGC）技术，需评估应用场景和合规要求。 简述虚拟数字人、智能审核人机协同、媒资编目标签三种应用场景的特点。（5分） 根据相关法律法规，说明AIGC内容标识的显式和隐式要求及合规审查要点。（5分）","options":[],"answer":"三种应用场景：\n①虚拟数字人：利用人工智能技术生成虚拟形象，可应用于新闻播报、节目主持等场景。特点是可实现全天候播报、降低人力成本，但需注意数字人形象的真实性和标识要求。\n②智能审核人机协同：由人工智能系统对媒体内容进行初步审核筛选，对疑似违规内容转交人工复核。特点是提高审核效率，机器处理大量常规内容，人工集中处理复杂判断，实现效率与准确性的平衡。\n③媒资编目标签：利用人工智能自动对媒体素材进行分类标注，生成结构化标签和元数据。特点是提升编目效率，支持快速检索和管理海量媒资资源，减少人工标注工作量。\nAIGC内容标识及合规要求：\n显式标识：在生成内容中添加可见的标识，如文字提示“本内容由人工智能生成”或图形水印，使用户能够直接识别内容为人工智能生成。\n隐式标识：在内容中嵌入不可见的数字水印或元数据标识，记录生成来源和时间等信息，用于后续追溯验证。\n合规审查要点： ①数据处理合规：确保训练数据来源合法，依据GB/T 43697进行数据分类分级，依据GB/T 45652落实数据安全保护要求，涉及个人信息的数据处理需遵守《个人信息保护法》。 ②算法备案：按规定完成算法备案，依据GB/T 45225开展算法评估，满足《互联网信息服务算法推荐管理规定》的透明度要求。 ③安全评估：依据GB/T 42888等标准开展模型安全评估。 ④内容审核：建立内容审核机制，确保生成内容符合法律法规要求。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.4/2.3","score":10.0,"difficulty":"基础"},{"id":"179","bank":"基础理论","code":"BAS-CA-009","type":"综合题","stem":"某广播电视播出机构需要根据相关法规完善安全播出管理体系。 根据62号令，说明播出事故的分类及各级别的特点，并简述突发事件的四种类型。（5分） 说明播出链路监控的主要环节和重要保障期的工作要求。（5分）","options":[],"answer":"播出事故分类（依据62号令）：\n①重大播出事故：造成严重社会影响或重大经济损失的播出事故，通常涉及较长时间的播出中断、大范围影响或造成严重后果。\n②严重播出事故：造成较大影响的播出事故，涉及一定时间的播出中断或播出质量明显下降，影响范围较大。\n③一般播出事故：造成一定影响但未达到严重标准的播出事故，涉及短时间的播出异常或轻微质量问题，影响范围有限。\n突发事件分为四类：自然灾害（如水旱灾害、气象灾害、地震灾害等）、事故灾难（如安全事故、交通运输事故等）、公共卫生事件（如传染病疫情、食品安全事件等）、社会安全事件（如恐怖袭击、经济安全事件等）。\n播出链路监控和重要保障期要求：\n播出链路监控主要环节： ①信号采集监控：监测信号源的质量和状态。 ②传输链路监控：监测信号传输过程中的质量和连通性。 ③播出质量监控：监测最终播出信号的质量，包括音视频质量、信号强度等。 ④应急切换监控：监控备份链路状态，确保应急切换功能可用。\n重要保障期工作要求： ①加强值班值守，安排技术骨干在岗保障。 ②暂停非必要的系统变更和维护操作。 ③开展全面安全检查，排查隐患。 ④完善应急预案，确保应急切换手段有效。 ⑤加强与相关部门的协调联动，确保信息畅通。","answerSource":"源库","answerNote":"","explanation":"","kp":"1.5/1.6/2.3","score":10.0,"difficulty":"基础"},{"id":"180","bank":"基础理论","code":"BAS-CA-010","type":"综合题","stem":"某机构计划在媒体内容生产中应用大语言模型，需要选择技术方案并进行系统设计。 对比少样本提示、思维链提示、RAG和模型微调四种方案的特点和适用场景。（5分） 说明行业模型选型的基本原则和智能体记忆管理的分类。（5分）","options":[],"answer":"四种技术方案对比：\n①少样本提示：在提示中给出少量示例引导模型完成任务。特点：无需训练，即时可用。适用场景：文本分类、格式转换等映射关系明确的简单任务。\n②思维链提示：引导模型逐步推理后再得出结论。特点：提高复杂推理准确性，但输出较长。适用场景：数学计算、逻辑分析、多步推理等复杂任务。\n③RAG（检索增强生成）：通过检索外部知识库增强模型输出。特点：知识可动态更新，支持溯源，无需重新训练。适用场景：需要结合最新知识或专有数据的问答场景。\n④模型微调：使用领域数据对模型参数进行进一步训练。特点：深度适配特定领域，输出风格一致，但训练成本高，知识更新需重新训练。适用场景：特定领域的长期固定任务，对输出风格有统一要求的场景。\n行业模型选型基本原则：\n①安全可控原则：确保数据安全和模型安全，敏感数据不出域，满足合规要求。 ②能力适配原则：模型能力与业务需求匹配，避免过度追求模型规模。 ③成本可行原则：算力资源、部署运维成本在可承受范围内。\n智能体记忆管理分类：\n①短期记忆：存储当前对话上下文信息，包括用户指令、中间结果等，对话结束后清除，通常存储在内存中。\n②长期记忆：通过向量数据库等持久化存储历史交互信息，支持跨会话的知识积累和检索，可用于保存用户偏好、历史决策等信息。\n附：命题说明\n本题库覆盖大纲第1部分（1.1至1.6）和第2部分（2.1至2.3）全部知识点，各章节均有题目涉及。\n难度分布：基础题约占60%（填空题、单选题、判断题主体部分），中等难度题约占30%（多选题、简答题），较高难度题约占10%（综合题及部分多选题）。\n题目设置注重广电视听行业场景，涉及制播系统、内容审核、智能媒资、智慧运维、安全播出等行业典型应用。\n法规名称和标准编号均依据大纲给定内容，技术概念依据GB/T 41867-2022《信息技术 人工智能 术语》等国家标准进行表述。","answerSource":"源库","answerNote":"","explanation":"","kp":"2.1/2.3","score":10.0,"difficulty":"基础"},{"id":"181","bank":"专业知识","code":"PRO-TK-001","type":"填空题","stem":"大模型交互的基本方法包括提问、追问、______和输出格式控制。","options":[],"answer":"分步引导|逐步引导|分步提问","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"","kp":"","score":2.0,"difficulty":"基础"},{"id":"182","bank":"专业知识","code":"PRO-TK-002","type":"填空题","stem":"在知识库构建中，文档导入后需要进行______设置，以便将长文档划分为适合检索的文本块。","options":[],"answer":"分块|切片|文本分块|分段","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"","kp":"","score":2.0,"difficulty":"基础"},{"id":"183","bank":"专业知识","code":"PRO-TK-003","type":"填空题","stem":"智能体的核心能力包括任务规划与______。","options":[],"answer":"工具调用|工具使用","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"","kp":"","score":2.0,"difficulty":"基础"},{"id":"184","bank":"专业知识","code":"PRO-TK-004","type":"填空题","stem":"生成式人工智能（AIGC）服务提供者应当按照《人工智能生成合成内容标识办法》的要求，对生成合成内容添加______和/或隐式标识。","options":[],"answer":"显式标识","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"","kp":"","score":2.0,"difficulty":"基础"},{"id":"185","bank":"专业知识","code":"PRO-TK-005","type":"填空题","stem":"GB 45438-2025《人工智能生成合成内容标识要求》规定了人工智能生成合成内容的标识方式和______要求。","options":[],"answer":"实施|标识实施","answerSource":"补全","answerNote":"源题库未收录答案，按解析与专业知识补全，建议与官方复习材料核对","explanation":"","kp":"","score":2.0,"difficulty":"基础"},{"id":"187","bank":"专业知识","code":"PRO-TK-007","type":"填空 库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"332","bank":"专业知识","code":"PRO-SA-002","type":"简答题","stem":"在面向故障诊断的提示词设计中，应包含哪些关键要素？（难度：中等）","options":[],"answer":"（1）角色设定：指定大模型扮演广电运维专家角色。 （2）任务描述：明确要求进行故障诊断分析。 （3）输入信息：提供故障现象、告警信息、系统拓扑、相关日志等。 （4）分析框架：要求按“现象描述、原因分析、根因定位、处置建议”等步骤展开。 （5）约束条件：要求引用技术标准和历史案例，输出结构化诊断报告。 （6）格式要求：指定输出格式（如表格、列表等）。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"333","bank":"专业知识","code":"PRO-SA-003","type":"简答题","stem":"简述知识库在内容审核场景中的应用流程。（难度：中等）","options":[],"answer":"（1）文档导入：将内容审核规范、违规内容特征库、历史违规案例等导入知识库。 （2）索引构建：对导入文档进行切分和索引，建立可检索的知识结构。 （3）检索匹配：在审核过程中，通过关键词和语义检索匹配相关审核依据。 （4）辅助研判：大模型结合检索结果对待审内容进行合规性判断。 （5）结果溯源：标注判断依据的来源文档和条款，支持人工复核。 （6）持续更新：根据新法规和新出现的违规特征定期更新知识库内容。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"334","bank":"专业知识","code":"PRO-SA-004","type":"简答题","stem":"在播出链路故障智能诊断中，告警信息分类、去重与优先级判定的主要步骤是什么？（难度：中等）","options":[],"answer":"（1）告警收集：汇聚来自不同节点和设备的告警信息。 （2）格式归一化：将不同来源的告警统一为标准格式。 （3）分类：按告警类型（如设备故障、链路中断、性能异常等）进行分类。 （4）去重：识别并合并相同或高度相似的重复告警。 （5）优先级判定：根据告警严重程度、影响范围和业务重要性判定优先级。 （6）输出：形成去重分类后的告警清单，供后续关联分析使用。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"335","bank":"专业知识","code":"PRO-SA-005","type":"简答题","stem":"简述GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》对生成式人工智能服务提供者的主要安全要求。（难度：中等）","options":[],"answer":"（1）训练数据安全：训练语料来源合法，内容安全，不含违法违规信息。 （2）模型安全：采取技术措施防范模型被用于生成违法有害内容。 （3）服务安全：建立内容过滤、用户输入安全检测等机制。 （4）标识要求：按照相关标准对生成合成内容添加标识。 （5）安全评估：提供服务前开展安全评估并依法备案。 （6）用户保护：建立投诉举报机制，保护用户合法权益。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"336","bank":"专业知识","code":"PRO-SA-006","type":"简答题","stem":"在传输网络异常检测中，区分网络攻击与设备故障的判定方法有哪些？（难度：中等）","options":[],"answer":"（1）流量模式分析：网络攻击通常表现为异常流量模式（如DDoS的高速率流量），设备故障多表现为流量中断或异常波动。 （2）时间规律分析：攻击往往有明确的时间特征，故障可能在任意时间发生。 （3）日志关联分析：安全设备日志中的攻击特征与网络设备日志中的故障信息进行关联比对。 （4）历史案例匹配：检索知识库中的历史攻击案例和故障案例进行比对。 （5）范围分析：攻击通常影响多个目标，设备故障通常局限于特定设备或链路。 （6）技术标准对照：参照相关安全标准中的判定依据进行辅助判断。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"337","bank":"专业知识","code":"PRO-SA-007","type":"简答题","stem":"简述AIGC内容溯源与鉴别的主要方法。（难度：中等）","options":[],"answer":"（1）标识核验：检查内容是否携带人工智能生成合成内容标识（显式标识和隐式标识）。 （2）元数据分析：分析文件属性、生成工具信息、时间戳等元数据。 （3）技术特征检测：通过算法检测图像、音频、视频中的生成痕迹。 （4）深度伪造鉴别：针对人脸替换、语音克隆等深度伪造内容采用专用检测方法。 （5）内容真实性核验：将内容与权威信息源进行比对，核验事实准确性。 （6）综合研判：结合以上多种方法进行综合判断，必要时由专业人员进行人工鉴别。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"338","bank":"专业知识","code":"PRO-SA-008","type":"简答题","stem":"在跨系统综合应急响应中，大模型如何协助完成威胁研判和影响评估？（难度：较高）","options":[],"answer":"（1）多源数据整合：将安全设备告警、网络流量数据、系统运行状态等多源数据统一输入大模型。 （2）关联分析：大模型对多源数据进行关联，识别攻击行为的整体脉络。 （3）威胁研判：结合历史案例和技术标准，判断威胁类型、攻击手段和可能的攻击者意图。 （4）影响评估：分析受影响的系统范围、数据资产和业务功能，评估安全事件的严重程度。 （5）方案建议：基于研判结果生成初步的应急响应方案和恢复计划。 （6）报告输出：形成结构化的应急响应报告，包含威胁研判、影响评估和处置建议。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"339","bank":"专业知识","code":"PRO-SA-009","type":"简答题","stem":"简述智能审核系统配置与调优的主要内容。（难度：中等）","options":[],"answer":"（1）审核规则配置：根据法律法规和行业标准设置审核规则和阈值。 （2）分类模型调优：针对不同内容类型（文字、图片、视频等）调整检测模型参数。 （3）样本集管理：维护和更新训练样本集，提升模型对新型违规内容的识别能力。 （4）策略调整：针对特殊场景（如重大活动保障期）调整审核策略和严格程度。 （5）误判分析：定期分析误判案例，优化规则和模型以降低误判率。 （6）人工复核机制：设置人工复核流程，对机器审核结果进行抽检和纠正。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"340","bank":"专业知识","code":"PRO-SA-010","type":"简答题","stem":"在综合应用能力考核中，“多道实操题目的衔接与信息复用”应注意哪些要点？（难度：较高）","options":[],"answer":"（1）信息继承：前序题目的分析结果和关键数据应在后续题目中合理复用。 （2）上下文衔接：保持多道题目之间的逻辑连贯性，避免信息断裂。 （3）知识库共享：建立统一的知识库，支撑多道题目的检索与引用需求。 （4）工作流串联：将多个步骤通过工作流编排串联，实现端到端的自动化分析。 （5）结果一致性：确保各题目之间的分析结论相互印证，不产生矛盾。 （6）文档整合：最终将各题目的分析结果整合为综合性报告或方案。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"341","bank":"专业知识","code":"PRO-SA-011","type":"简答题","stem":"简述上下文窗口管理中处理超长文本的常用方法。（3.1 上下文窗口管理）","options":[],"answer":"（1）分块处理：将超长文本按语义段落或固定长度切分为多个片段，分批输入模型处理。 （2）摘要压缩：先对文本进行摘要提取，将关键信息压缩后再输入模型。 （3）滑动窗口：使用重叠窗口方式逐段处理，保留上下文连贯性。 （4）信息检索：从超长文本中检索与问题最相关的片段，仅将相关内容输入模型。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"342","bank":"专业知识","code":"PRO-SA-012","type":"简答题","stem":"简述事实核验的基本流程。（3.1 事实核验方法）","options":[],"answer":"（1）提取关键事实：从模型生成内容中提取需要核验的事实性陈述。 （2）确定核验来源：选择权威信息源，如官方文档、标准规范、原始数据等。 （3）逐项比对：将关键事实与权威信息源进行比对，标注一致或不一致之处。 （4）记录核验结果：形成核验记录，对不一致的内容进行修正或标注。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"343","bank":"专业知识","code":"PRO-SA-013","type":"简答题","stem":"简述角色设定在提示词工程中的作用及基本要素。（3.2 角色设定方法）","options":[],"answer":"作用：通过设定角色，约束模型的知识范围、语言风格和行为方式，使输出更符合特定场景需求。\n基本要素： （1）角色身份：明确角色的职业身份和专业领域。 （2）职责范围：定义角色需要完成的任务和覆盖的知识领域。 （3）行为边界：设定角色的输出约束，如回答范围、语言风格、禁止事项等。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"344","bank":"专业知识","code":"PRO-SA-014","type":"简答题","stem":"简述多轮迭代纠偏的基本步骤。（3.2 多轮迭代纠偏）","options":[],"answer":"（1）识别偏差：分析模型输出与预期结果的差异，明确偏差类型和方向。 （2）指出问题：在后续对话中清晰描述模型输出的具体偏差。 （3）提供示例：给出符合预期的正确输出示例作为参照。 （4）验证修正：检查模型调整后的输出是否已纠正偏差，若仍有偏差则重复上述步骤。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"345","bank":"专业知识","code":"PRO-SA-015","type":"简答题","stem":"简述文档切分的三种常见策略及各自优缺点。（3.3 文档切分策略）","options":[],"answer":"（1）按段落切分：以自然段落为单位分割。优点是保留语义完整性；缺点是段落长度不均匀，可能超出或远小于模型处理窗口。 （2）按固定长度切分：以预设字符数或token数为单位分割。优点是切分均匀、易于控制；缺点是可能在句子中间断开，破坏语义完整性。 （3）按语义切分：根据内容主题和语义边界进行切分。优点是语义完整性好、检索匹配度高；缺点是切分逻辑复杂，计算开销较大。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"346","bank":"专业知识","code":"PRO-SA-016","type":"简答题","stem":"简述告警优先级判定的主要维度和基本规则。（3.4.1 告警优先级判定规则）","options":[],"answer":"主要维度： （1）影响范围：受影响的业务系统数量和用户规模。 （2）严重程度：故障对业务功能的损害程度。 （3）紧急程度：故障发展的紧迫性和是否需要立即干预。\n基本规则： 影响核心播出系统、影响大量用户、且需立即处理的告警为最高优先级；影响非核心系统、影响范围有限的告警为较低优先级。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"347","bank":"专业知识","code":"PRO-SA-017","type":"简答题","stem":"简述建立流量基线的基本步骤。（3.4.2 流量基线建立）","options":[],"answer":"（1）数据采集：在正常业务运行周期内采集网络流量数据，采样周期应覆盖完整的业务周期。 （2）数据清洗：去除异常数据和噪声干扰，确保基线数据的准确性。 （3）统计分析：计算各时间段的流量均值、方差等统计指标，确定正常波动区间。 （4）阈值设定：基于统计分析结果设定告警阈值，区分正常波动与异常流量。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"348","bank":"专业知识","code":"PRO-SA-018","type":"简答题","stem":"简述安全整改优先级排序的基本原则。（3.4.3 整改优先级排序方法）","options":[],"answer":"（1）风险等级优先：风险等级高的安全问题优先整改。 （2）影响范围优先：影响核心业务系统或大量用户的问题优先整改。 （3）可利用性优先：容易被利用的安全漏洞优先整改。 （4）资源约束考量：在有限资源下，综合评估整改成本与风险消减效果，优先安排投入产出比合理的整改项。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"349","bank":"专业知识","code":"PRO-SA-019","type":"简答题","stem":"简述审核系统误判率与漏判率的关系及平衡策略。（3.5.3 误判率与漏判率平衡）","options":[],"answer":"关系：误判率（将合规内容判为违规）与漏判率（将违规内容判为合规）通常呈此消彼长的关系。审核标准收紧时误判率上升、漏判率下降；标准放宽时则相反。\n平衡策略： （1）分级设置审核阈值，对高风险内容收紧标准，低风险内容适度放宽。 （2）引入人工复核机制，对机器审核的边界案例进行二次判断。 （3）持续监控误判率和漏判率指标，动态调整审核规则参数。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"350","bank":"专业知识","code":"PRO-SA-020","type":"简答题","stem":"简述复杂问题分解的基本策略。（3.6 复杂问题分解策略）","options":[],"answer":"（1）识别问题结构：分析问题的组成要素和内在逻辑关系。 （2）按业务流程分解：沿业务流程节点将问题拆分为有序的子任务。 （3）确定依赖关系：梳理子任务之间的前后依赖和数据传递关系。 （4）分配执行方式：根据子任务的性质，确定由智能体自动执行或人工介入处理。 （5）结果整合：将各子任务的输出结果按逻辑关系整合为最终答案。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":5.0,"difficulty":"基础"},{"id":"351","bank":"专业知识","code":"PRO-CA-001","type":"综合题","stem":"某省级广播电视台播出系统在一次重大转播任务期间出现多节点告警，具体情况如下：编码器A告警显示码率异常波动，复用器B告警显示输入信号丢失，传输链路C告警显示误码率突增，同时监测系统D报告画面出现马赛克。请设计一个基于大模型和知识库的故障智能诊断方案，说明分析步骤和预期输出。（难度：较高）","options":[],"answer":"方案设计：\n（1）数据采集与预处理（2分）： 将编码器A、复用器B、传输链路C、监测系统D的告警信息和相关日志统一导入大模型。对告警进行格式归一化、分类和去重处理，形成标准化的告警清单。\n（2）告警关联分析（2分）： 利用大模型对四组告警进行关联分析。根据信号流向（编码器A输出至复用器B，复用器B输出至传输链路C，监测系统D在终端监测），判断告警之间的因果关系。初步推断编码器A码率异常可能是根因，导致复用器B输入信号异常，进而引发传输链路C误码率升高和终端画面马赛克。\n（3）知识库检索辅助研判（2分）： 在知识库中检索类似故障案例和相关技术标准，匹配历史案例中“编码器码率异常导致下游连锁告警”的场景，获取处置经验。对照播出系统运维手册中的故障处理流程，验证分析判断的合理性。\n（4）根因定位与影响评估（2分）： 结合编码器A的详细日志，进一步定位码率异常的具体原因（如编码参数错误、输入源异常或设备硬件故障）。评估故障影响范围，包括受影响的节目频道、信号覆盖区域和预计持续时间。根据《广播电视安全播出管理规定》判定故障等级。\n（5）输出诊断报告（2分）： 生成结构化故障诊断分析报告，包含：故障概况、告警关联分析、根因判断、影响范围评估、故障等级判定、处置建议（如切换备用编码器、调整编码参数等）和后续监测建议。报告中标注引用的知识库来源和历史案例编号。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"352","bank":"专业知识","code":"PRO-CA-002","type":"综合题","stem":"某广播电视台计划建设一条“人工智能短视频自动化生产流水线”，涵盖选题策划、脚本生成、素材生成、视频合成、内容审核和发布管理六个环节。请设计该流水线的总体方案，重点说明各环节中人工智能技术和大模型的应用方式、智能体的编排逻辑，以及安全合规保障措施。（难度：较高）","options":[],"answer":"总体方案设计：\n（1）选题策划环节（1.5分）： 运用大模型分析热点话题和用户偏好数据，生成选题建议清单。人工编辑确认选题后，将选题信息传入下一环节。智能体负责调用数据分析工具完成趋势研判。\n（2）脚本生成环节（1.5分）： 基于确认的选题，运用大模型生成短视频脚本初稿，包括画面描述、解说词和字幕文案。脚本需符合广播电视内容规范，人工审核后进入下一环节。\n（3）素材生成环节（1.5分）： 根据脚本要求，运用人工智能图像生成、音频合成等技术生成或匹配素材。生成式人工智能（AIGC）生成的素材需按照GB 45438-2025要求添加标识。智能体负责协调多个生成工具的调用。\n（4）视频合成环节（1.5分）： 运用智能体编排工作流，将素材按脚本要求自动合成视频，包括剪辑、配乐、字幕叠加等。合成完成后自动转码为播出格式。\n（5）内容审核环节（2分）： 部署智能审核系统对生成视频进行自动化审核，覆盖政治导向、版权合规、内容安全等维度。审核结果由人工复核确认。违规内容自动标记并退回修改。审核标准应与《广播电视安全播出管理规定》和相关内容审核规范保持一致。\n（6）发布管理环节（1分）： 审核通过的视频自动推送到发布平台，发布记录归档备查。智能体负责管理发布队列和状态跟踪。\n（7）安全合规保障（1分）： 全流程需落实以下安全合规措施：生成内容标识管理、算法安全评估与备案、数据分类分级管理（参照GB/T 43697-2024）、内容安全责任追溯机制、关键环节人工把关。方案应进行可行性、安全性和合规性评估后实施。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"353","bank":"专业知识","code":"PRO-CA-003","type":"综合题","stem":"某广电网络公司传输系统监测到以下异常：凌晨2时至4时，某核心节点出口流量较日常均值增长300%，同时该节点防火墙日志记录了大量来自同一IP段的探测请求，部分服务器CPU利用率飙升至95%以上。运维团队决定运用大模型辅助分析。请说明分析思路、需要检索的知识库内容，以及如何输出异常分析报告。（难度：较高）","options":[],"answer":"分析思路：\n（1）异常识别与数据整合（2分）： 将流量监测数据、防火墙日志、服务器性能监控数据统一导入大模型。要求大模型识别异常模式：流量突增的时间集中性、IP来源的集中性、CPU飙升与流量异常的时间关联性。\n（2）攻击与故障区分（2分）： 大模型分析判断：凌晨时段流量突增300%且伴随同一IP段大量探测请求，符合网络攻击特征（可能为端口扫描或DDoS攻击的前期侦察）。服务器CPU飙升与异常流量时间吻合，进一步支持攻击判断。需排除设备故障可能性，如检查设备硬件状态和配置变更记录。\n（3）知识库检索（2分）： 在知识库中检索以下内容： 历史攻击案例：检索类似流量异常和IP探测的攻击事件记录。 技术标准：参照GB/T 22239-2019等级保护要求中的入侵防范相关条款。 应急预案：检索公司网络安全应急预案中关于DDoS攻击和端口扫描的处置流程。 设备配置文档：检索防火墙和服务器安全配置基线文档。\n（4）溯源与定位（2分）： 分析攻击源IP段的归属信息，追踪攻击路径中的中间节点。结合时间线还原攻击过程，判断攻击者可能的意图（如信息收集、服务拒绝或后续渗透准备）。\n（5）输出异常分析报告（2分）： 生成结构化异常分析报告，包含：异常概况（时间、节点、现象）、分析过程（数据关联分析、攻击与故障区分依据）、根因判断（攻击类型、攻击源信息）、影响评估（受影响系统和服务）、知识库引用（历史案例编号、标准条款）、处置建议（封禁攻击IP、加强防火墙规则、提升监控等级）和后续改进建议。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"354","bank":"专业知识","code":"PRO-CA-004","type":"综合题","stem":"某广播电视台在对人工智能内容审核系统进行例行检查时发现：近一个月内，涉及“重大活动保障期”相关的审核误判率上升15%，主要表现为将正常新闻报道误判为敏感内容。请分析可能的原因，并提出审核系统调优和策略调整方案。（难度：较高）","options":[],"answer":"原因分析（4分）：\n（1）审核规则过严：重大活动保障期间，审核系统可能启用了更严格的审核策略，导致正常新闻报道中的某些关键词触发了敏感内容判定规则。 （2）样本覆盖不足：训练样本中重大活动期间正常新闻报道的样本数量不足，模型对该类内容的识别能力有限。 （3）上下文理解不足：审核模型可能仅基于关键词匹配进行判断，未能结合新闻内容的上下文语义进行综合研判。 （4）规则更新滞后：保障期开始后审核规则调整未及时细化，缺少对正常新闻报道场景的例外处理规则。 （5）人工复核反馈未闭环：前期误判纠正的经验未及时回写到审核规则中，导致同类误判持续发生。\n调优与策略调整方案（6分）：\n（1）审核规则优化（2分）： 针对重大活动保障期建立专项审核规则集，在保持安全底线的前提下，对正常新闻报道中的常见关键词设置白名单或上下文豁免规则。对涉及领导人报道、官方发布等来源的内容适当降低误判敏感度。\n（2）模型与样本调优（1.5分）： 将近一个月的误判案例作为负样本补充到训练集，提升模型对正常新闻报道的识别能力。增加重大活动期间正常新闻报道的正样本数量。\n（3）审核策略分层（1分）： 建立分层审核机制：第一层机器快速审核，第二层语义深度分析，第三层人工复核。对重大活动保障期的内容提高人工复核比例。\n（4）反馈闭环机制（1分）： 建立误判纠正的快速反馈通道，人工复核中发现的误判案例应在24小时内回写到审核规则中，实现规则的动态更新。\n（5）效果评估与持续改进（0.5分）： 调整后进行为期一周的试运行，每日统计误判率并与调整前对比。参照GB/T 45654-2025中关于服务安全的要求，确保调优后的审核系统在安全性和准确性之间取得合理平衡。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"355","bank":"专业知识","code":"PRO-CA-005","type":"综合题","stem":"某广电单位需对其人工智能内容生产平台进行数据安全风险评估。已知该平台存储了大量节目素材、用户数据和技术配置文件，且部分数据通过大模型接口进行调用和处理。请设计一个基于大模型辅助的数据安全风险评估方案，包括评估流程、需要参照的标准法规、以及风险评估报告应包含的核心内容。（难度：较高）","options":[],"answer":"评估方案设计：\n（1）评估准备与数据梳理（2分）： 首先对平台数据进行全面梳理，按照GB/T 43697-2024《数据安全技术 数据分类分级规则》的要求，将数据分为不同类别（如节目素材、用户个人信息、技术配置、运维日志等）和不同安全级别。将分类分级结果、数据流转图、系统架构文档和技术配置文件导入大模型作为分析基础。\n（2）安全漏洞识别（2分）： 运用大模型对以下信息进行交叉分析： 技术配置文件：检查是否存在弱口令、未加密传输、权限配置不当等问题。 合规要求文件：对照GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》和GB/T 39204-2022《信息安全技术 关键信息基础设施安全保护要求》识别合规差距。 大模型接口安全：检查数据调用接口是否存在未授权访问、数据泄露风险，对照GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》评估生成式人工智能服务的安全合规情况。 数据流转链路：分析数据在采集、存储、处理、传输、销毁各环节的安全风险。\n（3）风险评估与等级评定（2分）： 参照GB/T 20984-2022《信息安全技术 信息安全风险评估方法》，从资产价值、威胁频率和脆弱性严重程度三个维度评估风险。大模型辅助完成多文档交叉对比与风险关联分析，识别组合风险和连锁风险。根据评估结果对风险进行等级评定（高、中、低），并制定整改优先级排序。\n（4）参照的法规标准（2分）： 评估过程中应参照以下法规标准： GB/T 43697-2024《数据安全技术 数据分类分级规则》 GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》 GB/T 20984-2022《信息安全技术 信息安全风险评估方法》 GB/T 39204-2022《信息安全技术 关键信息基础设施安全保护要求》 GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》 《生成式人工智能服务管理暂行办法》 《广播电视安全播出管理规定》（广电总局令第62号）\n（5）风险评估报告核心内容（2分）： 报告应包含以下核心内容： 评估概述：评估范围、对象、方法和依据标准。 数据资产清单：分类分级结果和数据流转说明。 安全漏洞清单：识别到的安全漏洞及其严重程度。 合规差距分析：技术现状与法规标准要求的差距。 风险等级评定：各风险点的等级评定和整改优先级排序。 整改建议：针对每个风险提出具体整改措施和完成时限建议。 大模型分析引用：标注大模型分析过程中引用的文档来源和标准条款，支持评估结论的可追溯性。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"356","bank":"专业知识","code":"PRO-CA-006","type":"综合题","stem":"某播出机构在节目直播期间，监控系统在3分钟内产生超过200条告警，涉及编码器、复用器、调制器等多个设备，部分节目画面出现马赛克。（3.4.1 告警风暴处理、故障传播路径分析、影响范围评估方法） 如何处理此次告警风暴？（5分） 如何分析故障传播路径并定位根因？（5分）","options":[],"answer":"告警风暴处理： 对200余条告警进行聚合去重，按设备类型和告警类型分类归并。 识别关联告警，抑制衍生告警的重复通知，减少信息干扰。 根据告警优先级判定规则，将与直播画面质量直接相关的告警标记为最高优先级。 快速筛查告警时间线，找出最早触发的告警作为根因排查起点。\n故障传播路径分析： 构建播出链路设备拓扑依赖关系图，明确编码器、复用器、调制器之间的信号流向。 将告警按时间顺序映射到拓扑图上，分析告警传播方向。 根据信号流向判断：若编码器告警先于复用器告警出现，且复用器告警先于调制器告警，则根因可能在编码器层面。 结合画面马赛克症状，进一步验证是否为编码器码率异常或输入信号中断导致下游连锁故障。 确认根因后，针对根因设备执行处置，并观察下游告警是否逐步消除。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"357","bank":"专业知识","code":"PRO-CA-007","type":"综合题","stem":"某传输网络中心开展安全检查，发现以下问题：管理网段与业务网段未做隔离；多台服务器使用默认账号密码；3名运维人员拥有全部系统管理员权限；用户数据存储未进行分类分级标记。（3.4.3 配置漏洞识别、权限过度分配、数据分类分级应用、整改优先级排序方法、风险评估报告要素） 分别指出上述问题属于哪类安全隐患？（4分） 制定整改优先级排序方案并说明理由。（6分）","options":[],"answer":"隐患分类： 管理网段与业务网段未隔离：属于网络配置漏洞，存在横向移动攻击风险。 服务器使用默认账号密码：属于认证配置漏洞，存在暴力破解和未授权访问风险。 运维人员拥有全部系统管理员权限：属于权限过度分配，存在越权操作和内部威胁风险。 用户数据未分类分级标记：属于数据安全管理缺失，无法实施差异化防护。\n整改优先级排序： 第一优先级：修改服务器默认账号密码。理由：默认密码最容易被利用，整改成本低、见效快，应立即执行。 第二优先级：实施管理网段与业务网段隔离。理由：网络隔离可有效阻断横向攻击路径，降低其他隐患被利用的风险。 第三优先级：调整运维人员权限，按最小权限原则重新分配。理由：权限过度分配风险较高但整改需协调业务流程，应在密码和网络隔离后尽快执行。 第四优先级：建立数据分类分级制度并完成标记。理由：数据分类分级是长期基础性工作，需制定规范并逐步推进，可在上述紧急整改后系统开展。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"358","bank":"专业知识","code":"PRO-CA-008","type":"综合题","stem":"某新媒体平台引入生成式人工智能（AIGC）辅助生成图文内容，上线后出现以下情况：部分生成内容包含未经核实的虚假信息；审核系统将一批合规内容误判为违规并拦截；已有内容标识规则与新出台的监管要求不一致。（3.5.2 生成内容审核流程、标识添加时机、违规内容处置、责任追溯机制；3.5.3 审核规则配置、误判率与漏判率平衡、审核标准版本管理） 针对虚假信息问题，设计生成内容审核流程的基本环节。（4分） 针对误判问题，提出平衡误判率与漏判率的改进措施。（3分） 针对标识规则不一致问题，说明审核标准版本管理的操作步骤。（3分）","options":[],"answer":"审核流程基本环节： 机器初筛：审核系统对生成内容进行自动化规则检测，标记疑似违规内容。 事实核验：对包含事实性陈述的内容，与权威信息源比对核验。 人工复核：对机器标记的疑似违规内容和边界案例进行人工审核判定。 标识添加：对通过审核的生成内容同步添加生成标识。 处置归档：对判定违规的内容执行下架拦截，记录违规证据并通知相关方。\n误判率与漏判率平衡措施： 分析误判案例的特征，识别导致误判的规则配置问题。 对高风险内容类别维持严格审核标准，对低风险内容适度放宽阈值。 增设人工复核环节处理机器审核的边界案例，减少误判。 持续监控误判率和漏判率指标，动态调整审核规则参数。\n审核标准版本管理操作步骤： 创建新版本审核标准文档，记录版本编号和生效时间。 对照新监管要求逐条修订标识规则，记录变更内容。 将旧版本标准归档存储，标注失效时间。 新版本经审批后发布生效，同步更新审核系统规则配置。 对审核人员开展新版本标准培训，确保执行一致。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"359","bank":"专业知识","code":"PRO-CA-009","type":"综合题","stem":"某广电网络遭受网络攻击，监控显示：凌晨2时至4时，出口流量异常增长至正常基线的8倍；多个外部IP对内部服务器发起大量SYN连接请求；部分播出调度系统出现短暂服务中断；攻击源IP涉及多个境外地址。（3.4.2 流量基线建立、DDoS识别特征、设备故障日志特征；3.4.4 影响范围判定、恢复优先级、跨系统协同处置、应急报告要素） 根据上述信息判断攻击类型并说明依据。（3分） 如何判定此次事件的影响范围？（3分） 制定应急处置方案，包括恢复优先级和跨系统协同措施。（4分）","options":[],"answer":"攻击类型判断： 判定为DDoS攻击（分布式拒绝服务攻击）。 依据： 出口流量在凌晨非业务高峰时段异常增长至基线8倍，符合DDoS流量激增特征。 多个外部IP发起大量SYN连接请求，属于典型的SYN Flood攻击手法。 攻击源涉及多个境外IP地址，符合分布式攻击源特征。 播出调度系统服务中断，符合拒绝服务攻击的后果表现。\n影响范围判定： 确认受影响的系统：检查哪些内部服务器和业务系统遭受攻击并出现异常。 评估业务影响：确认播出调度系统中断是否影响了实际播出业务，是否有冗余系统接管。 评估数据影响：检查是否有数据泄露或篡改迹象。 评估用户影响：统计受影响的用户规模和服务中断时长。\n应急处置方案： 恢复优先级： 第一优先级：恢复播出调度系统，确保安全播出不中断。启动备用系统或冗余链路接管业务。 第二优先级：在网络边界实施流量清洗和攻击源IP封堵，缓解攻击压力。 第三优先级：全面排查各系统状态，确认无其他安全隐患后恢复正常运行。 跨系统协同措施： 建立应急指挥小组，明确网络运维、播出运维、安全管理等各团队职责分工。 网络团队负责流量监控和攻击防护，实时共享攻击态势信息。 播出团队负责业务连续性保障，及时反馈播出状态。 安全团队负责攻击溯源和证据保全，协调外部安全机构获取支持。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"360","bank":"专业知识","code":"PRO-CA-010","type":"综合题","stem":"某内容审核团队需要建设一套人工智能辅助的深度伪造内容检测与辟谣工作流。已知需求包括：每日处理大量用户举报的疑似伪造内容；需要整合多知识库（包括历史案例库、法规库、技术特征库）进行综合研判；最终自动生成辟谣报告。（3.5.4 AIGC内容统计特征、元数据解析、深度伪造技术原理、辟谣应对流程；3.6 多知识库联动、综合报告自动生成、复杂问题分解策略） 设计该工作流的问题分解策略，列出主要子任务。（4分） 说明多知识库联动检索的实现思路。（3分） 描述辟谣报告自动生成应包含的核心内容。（3分）","options":[],"answer":"问题分解策略： 将整体任务按业务流程分解为以下子任务： 内容采集与预处理：接收用户举报内容，提取图像、音频、视频、文本等素材。 元数据解析：解析文件元数据，提取生成工具标识、创建时间、修改记录等信息。 技术检测：对图像进行面部边缘伪影分析，对音频进行频谱异常检测，对视频进行帧间一致性检查。 知识库检索：将检测特征与历史案例库、法规库、技术特征库进行比对检索。 综合研判：汇总检测结果和知识库匹配信息，判定内容是否为深度伪造。 报告生成：根据研判结果自动生成辟谣报告。\n多知识库联动检索实现思路： 对历史案例库使用语义检索，匹配与当前内容特征相似的历史伪造案例。 对法规库使用关键词检索，查找适用的法律法规条款。 对技术特征库使用混合检索（关键词与语义结合），匹配已知深度伪造技术特征。 将各知识库的检索结果按相关性排序，汇总后作为综合研判的参考依据。 各知识库独立维护更新，通过统一检索接口实现联动调用。\n辟谣报告核心内容： 事件概述：举报内容的基本描述和发现经过。 检测结果：元数据解析结果和技术检测发现的具体异常特征。 判定结论：综合研判结论，明确标注是否为深度伪造内容。 证据支撑：引用的技术检测数据和历史案例比对结果。 处置建议：对伪造内容的下架、标识和传播阻断建议。 法规依据：适用的法律法规条款和监管要求。","answerSource":"源库","answerNote":"","explanation":"","kp":"","score":10.0,"difficulty":"基础"},{"id":"447","bank":"综合题库","code":"AI1K-Q0001","type":"单选题","stem":"同一知识库同时存在现行手册和废止手册。下列做法中，哪一项正确且直接针对本场景？","options":[{"key":"A","text":"上线后立即删除上一可用版本以节省空间"},{"key":"B","text":"检索时优先筛选生效且适用的资料"},{"key":"C","text":"只按相似度最高选择废止版本作为现行依据"},{"key":"D","text":"仅用漏洞数量代替全部业务风险等级"}],"answer":"B","answerSource":"解析","answerNote":"据题库解析文本提取","explanation":"按有效时间版本和适用范围筛选资料的机制。检索时优先筛选生效且适用的资料。错误做法：只按相似度最高选择废止版本作为现行依据。","kp":"","score":2.0,"difficulty":"中等"},{"id":"448","bank":"综合题库","code":"AI1K-Q0002","type":"单选题","stem":"需要把经审核脚本转为播报音频。下列做法中，哪一项正确且直接针对本场景？","options":[{"key":"A","text":"认为隐式标识必须且只能采用数字水印"},{"key":"B","text":"把一次预测值视为未来容量的确定事实"},{"key":"C","text":"采用获准声音资源并核查发音和标识要求"},{"key":"D","text":"未经授权克隆特定主持人声音并公开使用"}],"answer":"C","answerSource":"解析","answerNote":"据题库解析文本提取","explanation":"由文本生成语音的技术。采用获准声音资源并核查发音和标识要求。错误做法：未经授权克隆特定主持人声音并公开使用。","kp":"","score":2.0, var BY_ID = {};
QUESTIONS.forEach(function(q){ BY_ID[q.id] = q; });

var TYPE_LIST = ['单选题','多选题','判断题','填空题','简答题','综合题'];
var TYPE_BADGE = {'单选题':'','多选题':'b2','判断题':'b3','填空题':'b4','简答题':'b5','综合题':'b6'};
var BANK_LIST = [];
QUESTIONS.forEach(function(q){ if(BANK_LIST.indexOf(q.bank)<0) BANK_LIST.push(q.bank); });

var KEY = 'ai-quiz-v1';
var STORAGE_OK = (function(){
  try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); return true; }catch(e){ return false; }
})();
var defStore = { records:{}, favs:[], drafts:{}, last:null, filters:null };
var store = loadStore();

function loadStore(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var s = JSON.parse(raw); return {
    records: s.records||{}, favs: s.favs||[], drafts: s.drafts||{}, last: s.last||null, filters: s.filters||null }; } }
  catch(e){}
  return JSON.parse(JSON.stringify(defStore));
}
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

var state = { page:'home', session:null, filters: store.filters || { bank:'全部题库', type:'全部题型', scope:'全部题' } };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function pad(n){ return n<10?'0'+n:''+n; }
function todayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.className='toast show';
  clearTimeout(t._h); t._h = setTimeout(function(){ t.className='toast'; }, 1600); }

function normAns(s){ return String(s||'').toLowerCase().replace(/\s+/g,'')
  .replace(/[。，,、；;：:！!？?“”"'（）()【】\[\]…—\-·]/g,''); }

function isObjective(q){ return q.type==='单选题'||q.type==='多选题'||q.type==='判断题'; }

function judge(q, ans){
  if(q.type==='单选题'||q.type==='判断题') return ans === q.answer;
  if(q.type==='多选题') return ans && ans.split('').sort().join('') === q.answer;
  if(q.type==='填空题'){
    var n = normAns(ans); if(!n) return false;
    var ok = String(q.answer).split('|').some(function(v){
      var nv = normAns(v); if(!nv) return false;
      if(n === nv) return true;
      if(nv.length>=3 && n.indexOf(nv)>=0) return true;
      return false;
    });
    return ok;
  }
  return null;
}

function answerDisplay(q){
  if(q.type==='判断题') return q.answer==='A' ? 'A. 正确' : 'B. 错误';
  if(q.type==='单选题'||q.type==='多选题'){
    return String(q.answer).split('').map(function(k){
      var o = (q.options||[]).filter(function(x){ return x.key===k; })[0];
      return k + '. ' + (o ? o.text : '');
    }).join('\n');
  }
  return String(q.answer).replace(/\|/g,' / ');
}

function recordOf(id){ return store.records[id]; }
function verdictOf(id){ var r = store.records[id]; return r ? r.verdict : null; }
function isFav(id){ return store.favs.indexOf(id) >= 0; }

function recordAnswer(q, ans, correct, self){
  var r = store.records[q.id] || { tries:0, right:0, wrong:0 };
  r.tries++; r.lastAns = ans; r.lastTs = Date.now();
  if(correct === true){ r.right++; r.verdict='right'; }
  else if(correct === false){ r.wrong++; r.verdict='wrong'; }
  else { r.verdict = self || 'fuzzy'; }
  store.records[q.id] = r; saveStore(); updateSessionLog(q.id, ans, correct, self);
}

function updateSessionLog(id, ans, correct, self){
  if(!state.session) return;
  state.session.log[id] = { ans:ans, correct:correct, self:self };
  saveLast();
}
function saveLast(){
  if(!state.session) return;
  store.last = { title: state.session.title, ids: state.session.ids, idx: state.session.idx,
                 log: state.session.log, ts: Date.now() };
  saveStore();
}

function filtersMatch(f){
  return function(q){
    if(f.bank !== '全部题库' && q.bank !== f.bank) return false;
    if(f.type === '客观题'){ if(q.type==='简答题'||q.type==='综合题') return false; }
    else if(f.type !== '全部题型' && q.type !== f.type) return false;
    return true;
  };
}
function collect(f, scope){
  var base = QUESTIONS.filter(filtersMatch(f));
  if(scope === '未做') base = base.filter(function(q){ return !store.records[q.id]; });
  if(scope === '错题') base = base.filter(function(q){ var v = verdictOf(q.id); return v==='wrong'||v==='fuzzy'||v==='unknown'; });
  if(scope === '收藏') base = base.filter(function(q){ return isFav(q.id); });
  return base;
}
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function startSession(qs, title, shuffleOn){
  if(!qs.length){ toast('没有符合条件的题目'); return; }
  var ids = (shuffleOn ? shuffle(qs) : qs).map(function(q){ return q.id; });
  state.session = { ids: ids, idx:0, log:{}, title: title };
  saveLast();
  go('practice');
}

function go(page){ state.page = page; window.scrollTo(0,0); render(); }

    ['fav','收藏','M12 4l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 10.2l5.9-.9z'],

      + '<svg viewBox="0 0 24 24"><path d="'+t[2]+'"/></svg><span>'+t[1]+'</span></a>';

function stats(){
  var total = QUESTIONS.length, done = 0, right = 0, judged = 0, today = 0;
  var tk = todayKey();
  var perType = {}, perBank = {};
  QUESTIONS.forEach(function(q){
    perType[q.type] = perType[q.type] || { done:0, total:0 };
    perBank[q.bank] = perBank[q.bank] || { done:0, total:0 };
    perType[q.type].total++; perBank[q.bank].total++;
    var r = store.records[q.id];
    if(r && r.tries){
      done++; perType[q.type].done++; perBank[q.bank].done++;
      if(r.verdict === 'right'){ right++; judged++; }
      else if(r.verdict === 'wrong'){ judged++; }
      if(r.lastTs && todayKey(new Date(r.lastTs)) === tk) today++;
    }
  });
  var wrong = 0, fav = store.favs.length;
  for(var id in store.records){ var v = store.records[id].verdict; if(v==='wrong'||v==='fuzzy'||v==='unknown') wrong++; }
  return { total:total, done:done, right:right, judged:judged, rate: judged? Math.round(right*100/judged):0,
    today:today, wrong:wrong, fav:fav, perType:perType, perBank:perBank };
}

function renderHome(){
  var s = stats(), f = state.filters;
  var h = '';
  h += '<div class="top"><div class="ico">题</div><div><h1>AI 刷题</h1><div class="sub">'+s.total+' 道题 · 离线可用 · 含答案与解析</div></div></div>';

  h += '<div class="card"><div class="metrics">'
    + '<div><div class="n">'+s.done+'</div><div class="l">已练题数</div></div>'
    + '<div><div class="n">'+s.rate+'%</div><div class="l">正确率</div></div>'
    + '<div><div class="n">'+s.today+'</div><div class="l">今日答题</div></div>'
    + '</div></div>';

  h += '<div class="card"><h2>题库</h2><div class="chips" id="fbank">'
    + ['全部题库'].concat(BANK_LIST).map(function(b){
        return '<button class="chip '+(f.bank===b?'on':'')+'" data-act="fbank" data-v="'+esc(b)+'">'+esc(b)+'</button>';
      }).join('') + '</div>';

  h += '<h2 style="margin-top:14px">题型</h2><div class="chips" id="ftype">'
    + ['全部题型','客观题'].concat(TYPE_LIST).map(function(t){
        return '<button class="chip '+(f.type===t?'on':'')+'" data-act="ftype" data-v="'+esc(t)+'">'+esc(t)+'</button>';
      }).join('') + '</div>';

  h += '<h2 style="margin-top:14px">范围</h2><div class="chips" id="fscope">'
    + ['全部题','未做','错题','收藏'].map(function(sc){
        return '<button class="chip '+(f.scope===sc?'on':'')+'" data-act="fscope" data-v="'+esc(sc)+'">'+esc(sc)+'</button>';
      }).join('') + '</div>';

  var pool = collect(f, f.scope);
  h += '<p class="hint">当前筛选共 '+pool.length+' 道题</p>';
  h += '<div class="row" style="margin-top:12px">'
    + '<button class="btn" data-act="start" data-mode="seq">顺序练习</button>'
    + '<button class="btn ghost" data-act="start" data-mode="rand">随机练习</button></div>';
  h += '</div>';

  if(store.last && store.last.ids && store.last.ids.length){
    var li = store.last.idx||0;
    h += '<div class="card" data-act="continue" style="display:flex;align-items:center;gap:12px">'
      + '<div class="em" style="width:38px;height:38px;border-radius:11px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700">续</div>'
      + '<div style="flex:1"><div style="font-weight:600">继续上次练习</div><div class="hint">'+esc(store.last.title||'练习')+' · 进行到第 '+Math.min(li+1, store.last.ids.length)+' / '+store.last.ids.length+' 题</div></div>'
      + '<div style="color:var(--sub);font-size:18px">›</div></div>';
  }

  h += '<div class="card"><h2>快捷入口</h2>'
    + '<div class="entry" data-act="tab" data-tab="wrong"><div class="em">错</div><div class="t">错题本<div class="d">答错与存疑的题，共 '+s.wrong+' 道</div></div><div class="go">›</div></div>'
    + '<div class="entry" data-act="tab" data-tab="fav"><div class="em">★</div><div class="t">我的收藏<div class="d">已收藏 '+s.fav+' 道题</div></div><div class="go">›</div></div>'
    + '<div class="entry" data-act="tab" data-tab="me"><div class="em">统</div><div class="t">学习统计<div class="d">题库进度、正确率与最近 7 天</div></div><div class="go">›</div></div>'
    + '</div>';

  return h + tabbar('home');
}

function typeBadge(q){ return '<span class="badge '+TYPE_BADGE[q.type]+'">'+q.type+'</span>'; }

function renderPractice(){
  var se = state.session;
  if(!se || !se.ids.length){ return '<div class="empty">没有正在进行的练习<br><br><button class="btn sm" data-act="tab" data-tab="home">回到首页</button></div>' + tabbar('home'); }
  var q = BY_ID[se.ids[se.idx]];
  if(!q){ se.idx = 0; q = BY_ID[se.ids[0]]; }
  var log = se.log[q.id];
  var done = !!log;
  var h = '';

  h += '<div class="qhead"><button class="back" data-act="exit">‹</button>'
    + '<div class="pos">第 '+(se.idx+1)+' / '+se.ids.length+' 题</div>'
    + '<button class="star '+(isFav(q.id)?'on':'')+'" data-act="fav">'+(isFav(q.id)?'★':'☆')+'</button></div>';
  h += '<div class="bar"><i style="width:'+Math.round((se.idx+1)*100/se.ids.length)+'%"></i></div>';

  h += '<div class="qmeta">'+typeBadge(q)+'<span class="k">'+esc(q.bank)+' · '+esc(q.kp||'—')+' · ID '+q.id+'</span></div>';
  h += '<div class="stem">'+esc(q.stem)+'</div>';

  if(q.type==='填空题'){
    h += '<div class="fillbox"><input id="fill" type="text" enterkeyhint="done" autocomplete="off" '
      + 'placeholder="在此填写答案" value="'+(log&&log.ans?esc(log.ans):'')+'" '+(done?'disabled':'')+'></div>';
    if(!done) h += '<div class="actions"><button class="btn" data-act="submit-fill">提交答案</button></div>';
  } else if(q.type==='简答题'||q.type==='综合题'){
    h += '<textarea class="textarea" id="draft" placeholder="写下你的答题要点，再对照参考答案自评（草稿只保存在本机）">'+(esc(store.drafts[q.id]||''))+'</textarea>';
    if(!done){
      h += '<div class="actions"><button class="btn soft" data-act="reveal">查看参考答案</button></div>';
    }
  } else {
    h += '<div class="opts" id="opts">';
    q.options.forEach(function(o){
      var cls = 'opt';
      if(done){
        var chosen = (log.ans||'').indexOf(o.key) >= 0;
        if(log.correct === true && chosen) cls += ' right';
        else if(log.correct === false){
          if(chosen) cls += ' wrong';
          else if(q.answer.indexOf(o.key) >= 0) cls += ' right';
        } else if(log.correct === null || log.correct === undefined){
          if(q.answer.indexOf(o.key) >= 0) cls += ' right';
          if(chosen) cls += ' sel';
        }
      }
      h += '<button class="'+cls+'" data-act="opt" data-k="'+o.key+'" '+(done?'disabled':'')+'>'
        + '<span class="k">'+o.key+'</span><span class="t">'+esc(o.text)+'</span></button>';
    });
    h += '</div>';
    if(!done && q.type==='多选题') h += '<div class="actions"><button class="btn" data-act="submit-multi">确认提交</button></div>';
    if(!done && q.type==='多选题') h += '<p class="hint">多选题请选全所有正确项再提交</p>';
  }

  if(done){
    h += feedbackBlock(q, log);
  }

  var isLast = se.idx >= se.ids.length-1;
  h += '<div class="actions">'
    + '<button class="btn ghost" data-act="prev" '+(se.idx===0?'disabled':'')+'>上一题</button>'
    + '<button class="btn" data-act="next">'+(isLast?'完成练习':'下一题')+'</button></div>';
  h += '<div class="spacer"></div>';
  return h;
}

function feedbackBlock(q, log){
  var subjective = (q.type==='简答题'||q.type==='综合题');
  var cls = 'info', title = subjective ? '参考答案已显示，请对照自评' : '已显示答案与解析';
  if(log.correct === true){ cls='ok'; title = subjective ? '自评：已掌握' : '回答正确'; }
  else if(log.correct === false){ cls='bad'; title='回答错误'; }
  else if(log.self === 'master'){ cls='ok'; title='自评：已掌握'; }
  else if(log.self === 'fuzzy'){ cls='bad'; title='自评：有点模糊，已加入错题本'; }
  else if(log.self){ cls='bad'; title='自评：没掌握，已加入错题本'; }

  var h = '<div class="feedback '+cls+'">';
  h += '<div class="fb-title '+cls+'">'+title+'</div>';
  if(log.ans && log.ans!==''){
    var shown = q.type==='填空题' ? String(log.ans) : String(log.ans).split('').join(' ');
    h += '<div class="fb-src">你的作答：'+esc(shown)+'</div>';
  }
  if(!subjective) h += '<div class="fb-ans"><b>正确答案</b><br>'+nl2br(answerDisplay(q))+'</div>';
  var exp = (q.explanation||'').trim();
  if(q.type==='简答题'||q.type==='综合题'){
    h += '<div class="fb-exp"><span class="h">参考答案与要点</span>'+nl2br(answerDisplay(q))+'</div>';
    if(exp) h += '<div class="fb-exp"><span class="h">解析</span>'+nl2br(exp)+'</div>';
  } else if(exp){
    h += '<div class="fb-exp"><span class="h">解析</span>'+nl2br(exp)+'</div>';
  } else {
    h += '<div class="fb-exp"><span class="h">解析</span>本题源题库未附解析，可对照题干与正确答案理解。</div>';
  }
  var srcTxt = q.answerSource==='源库' ? '题库原始参考答案' : (q.answerSource==='解析' ? '由题库解析文本提取' : '源题库未收录，按解析与专业知识补全');
  h += '<div class="fb-src">答案来源：'+srcTxt+'</div>';
  if(q.type==='填空题' && log.correct === false){
    h += '<div class="actions"><button class="btn sm ghost" data-act="mark-right">我的答案意思正确，标为答对</button></div>';
  }
  if(q.type==='简答题'||q.type==='综合题'){
    if(!log.self){
      h += '<div class="actions"><button class="btn sm" data-act="self" data-v="master">已掌握</button>'
        + '<button class="btn sm ghost" data-act="self" data-v="fuzzy">有点模糊</button>'
        + '<button class="btn sm ghost" data-act="self" data-v="unknown">不会</button></div>';
    }
  }
  return h + '</div>';
}

function renderList(kind){
  var rows = [];
  var title = kind==='wrong' ? '错题本' : '我的收藏';
  QUESTIONS.forEach(function(q){
    if(kind==='wrong'){ var v = verdictOf(q.id); if(v==='wrong'||v==='fuzzy'||v==='unknown') rows.push(q); }
    else if(isFav(q.id)) rows.push(q);
  });
  var h = '<div class="top"><div class="ico">'+(kind==='wrong'?'错':'★')+'</div><div><h1>'+title+'</h1>'
    + '<div class="sub">共 '+rows.length+' 道题</div></div></div>';

  if(!rows.length){
    h += '<div class="card"><div class="empty">'+(kind==='wrong'
      ? '还没有错题<br>答错的题会自动进入错题本，便于集中重练'
      : '还没有收藏<br>刷题时点右上角 ☆ 即可收藏重点题')+'</div></div>';
    return h + tabbar(kind);
  }

  h += '<div class="row" style="margin:12px 0"><button class="btn" data-act="practice-ids" data-kind="'+kind+'" data-mode="seq">顺序重练</button>'
    + '<button class="btn ghost" data-act="practice-ids" data-kind="'+kind+'" data-mode="rand">随机重练</button></div>';

  h += '<div class="card list">';
  rows.slice(0, 400).forEach(function(q){
    var r = recordOf(q.id) || {};
    var meta = [];
    meta.push(esc(q.bank)+' · '+esc(q.type));
    if(r.tries) meta.push('作答 '+r.tries+' 次');
    if(r.wrong) meta.push('错 '+r.wrong+' 次');
    if(r.lastTs) meta.push(new Date(r.lastTs).toLocaleDateString('zh-CN'));
    h += '<div class="item" data-act="open-q" data-id="'+q.id+'"><div class="body">'
      + '<div style="margin-bottom:4px">'+typeBadge(q)+'</div>'
      + '<div class="s">'+esc(q.stem)+'</div><div class="m">'+meta.join(' · ')+'</div></div>'
      + '<div style="color:var(--sub);font-size:18px;align-self:center">›</div></div>';
  });
  h += '</div>';
  if(rows.length > 400) h += '<p class="hint">仅显示前 400 道，可用“顺序重练”逐题练习。</p>';
  return h + tabbar(kind);
}

function renderMe(){
  var s = stats();
  var h = '<div class="top"><div class="ico">我</div><div><h1>学习记录</h1><div class="sub">数据保存在本机浏览器，不上传</div></div></div>';

  h += '<div class="card"><div class="metrics">'
    + '<div><div class="n">'+s.done+'<span style="font-size:13px;color:var(--sub)"> / '+s.total+'</span></div><div class="l">已练 / 总题数</div></div>'
    + '<div><div class="n">'+s.rate+'%</div><div class="l">正确率</div></div>'
    + '<div><div class="n">'+s.wrong+'</div><div class="l">错题数</div></div></div></div>';

  // last 7 days
  var days = [], counts = [];
  for(var i=6;i>=0;i--){

  }
  var mx = Math.max.apply(null, counts.concat([1]));

        var hh = Math.round(c*72/mx);

  h += '<div class="card"><h2>题库进度</h2>' + BANK_LIST.map(function(b){

      return '<div class="statbar"><span class="nm">'+esc(b)+'</span><span class="tr"><i style="width:'+pct+'%"></i></span>'
        + '<span class="vl">'+p.done+'/'+p.total+'</span></div>';
    }).join('') + '</div>';

  h += '<div class="card"><h2>题型进度</h2>' + TYPE_LIST.map(function(t){
      var p = s.perType[t]||{done:0,total:0}; if(!p.total) return '';
      var pct = Math.round(p.done*100/p.total);
      return '<div class="statbar"><span class="nm">'+t+'</span><span class="tr"><i style="width:'+pct+'%"></i></span>'
        + '<span class="vl">'+p.done+'/'+p.total+'</span></div>';

  h += '<div class="card"><h2>数据</h2>'
    + '<div class="row"><button class="btn ghost sm" data-act="export">导出记录</button>'
    + '<button class="btn ghost sm" data-act="import">导入记录</button></div>'
    + '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="reset">清空全部记录</button></div>'
    + '<p class="hint">记录仅保存在本机浏览器；换设备时可用「导出记录」生成 JSON，再在另一台设备上「导入记录」。</p></div>';

  if(!STORAGE_OK){
    h += '<div class="card" style="border:1.5px solid var(--bad)"><h2 style="color:var(--bad)">当前无法保存记录</h2>'
      + '<div class="note">这个打开方式不允许本页写入本机存储（常见于直接用“文件”App 预览本地 HTML）。'
      + '刷题和看解析不受影响，但答题记录不会保存。建议改用 Safari 通过网址打开，并“添加到主屏幕”。</div></div>';
  }
  h += '<div class="card"><h2>使用说明</h2><div class="note">'
    + '<b>1. 添加到主屏幕</b>：用 Safari 打开本页 → 点底部「分享」→「添加到主屏幕」，之后像 App 一样从桌面打开。<br>'
    + '<b>2. 离线可用</b>：题库、答案、解析全部内置在文件里，断网也能刷题，记录同样保存在本机。<br>'
    + '<b>3. 答案来源</b>：'+s.total+' 道题中，312 道含题库原始参考答案，254 道由题库解析文本提取，769 道为源库缺答案时的补全结果（解析面板会标注）。补全题建议对照官方复习材料复核。<br>'
    + '<b>4. 错题本</b>：答错的客观题、自评“有点模糊/不会”的主观题会自动进入错题本，可一键重练。'
    + '</div></div>';

  h += '<p class="hint" style="text-align:center;margin:18px 0 8px">题库来源：question.sql · 共 '+s.total+' 题</p>';
  return h + tabbar('me');
}

function render(){
  var app = document.getElementById('app');
  var page = state.page;
  var html = page==='home' ? renderHome()
    : page==='practice' ? renderPractice()
    : page==='wrong' ? renderList('wrong')
    : page==='fav' ? renderList('fav')
    : renderMe();
  app.innerHTML = html;
  if(page==='practice' && state.session){
    var q = BY_ID[state.session.ids[state.session.idx]];
    if(q && (q.type==='简答题'||q.type==='综合题')){
      var d = document.getElementById('draft');
      if(d){ d.addEventListener('input', function(){ store.drafts[q.id] = d.value; saveStore(); }); }
    }
  }
}

/* ---------------- actions ---------------- */

var pendingMulti = {};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act==='tab'){ state.session = null; go(el.getAttribute('data-tab')); return; }
  if(act==='fbank' || act==='ftype' || act==='fscope'){
    var v = el.getAttribute('data-v');
    if(act==='fbank') state.filters.bank = v;
    if(act==='ftype') state.filters.type = v;
    if(act==='fscope') state.filters.scope = v;
    store.filters = state.filters; saveStore(); render(); return;
  }
  if(act==='start'){
    var mode = el.getAttribute('data-mode');
    var pool = collect(state.filters, state.filters.scope);
    var title = (state.filters.bank==='全部题库'?'全部题库':state.filters.bank) + ' · ' + (state.filters.type==='全部题型'?'全部题型':state.filters.type);
    startSession(pool, title + (mode==='rand'?'（随机）':'（顺序）'), mode==='rand');
    return;
  }
  if(act==='continue'){
    var l = store.last;
    if(!l || !l.ids || !l.ids.length){ toast('没有可继续的练习'); return; }
    state.session = { ids:l.ids, idx:l.idx||0, log:l.log||{}, title:l.title||'练习' };
    go('practice'); return;
  }
  if(act==='exit'){ go('home'); return; }

  var se = state.session;
  var q = se ? BY_ID[se.ids[se.idx]] : null;

  if(act==='fav'){
    if(!q) return;
    var i = store.favs.indexOf(q.id);
    if(i>=0){ store.favs.splice(i,1); toast('已取消收藏'); } else { store.favs.push(q.id); toast('已加入收藏'); }
    saveStore(); render(); return;
  }
  if(act==='opt'){
    if(!q || se.log[q.id]) return;
    var k = el.getAttribute('data-k');
    if(q.type==='多选题'){
      var cur = pendingMulti[q.id] || '';
      cur = cur.indexOf(k)>=0 ? cur.replace(k,'') : cur + k;
      pendingMulti[q.id] = cur.split('').sort().join('');
      var btns = document.querySelectorAll('#opts .opt');
      for(var bi=0;bi<btns.length;bi++){
        var bk = btns[bi].getAttribute('data-k');
        btns[bi].className = 'opt' + (pendingMulti[q.id].indexOf(bk)>=0 ? ' sel' : '');
      }
      return;
    }
    // single / judge: immediate judgement
    var ans = k;
    var ok = judge(q, ans);
    recordAnswer(q, ans, ok, null);
    render();
    setTimeout(scrollFeedback, 60);
    return;
  }
  if(act==='submit-multi'){
    if(!q) return;
    var a = pendingMulti[q.id] || '';
    if(!a){ toast('请先选择选项'); return; }
    recordAnswer(q, a, judge(q, a), null);
    render(); setTimeout(scrollFeedback, 60); return;
  }
  if(act==='submit-fill'){
    if(!q) return;
    var inp = document.getElementById('fill');
    var val = inp ? inp.value.trim() : '';
    if(!val){ toast('请先填写答案'); return; }
    recordAnswer(q, val, judge(q, val), null);
    render(); setTimeout(scrollFeedback, 60); return;
  }
  if(act==='reveal'){
    if(!q) return;
    recordAnswer(q, '', null, null);
    render(); setTimeout(function(){ scrollFeedback(); }, 60); return;
  }
  if(act==='self'){
    if(!q) return;
    var sv = el.getAttribute('data-v');
    recordAnswer(q, '', sv==='master' ? true : null, sv);
    render(); setTimeout(scrollFeedback, 60); return;
  }
  if(act==='mark-right'){
    if(!q) return;
    var rec = store.records[q.id] || {};
    rec.verdict = 'right'; store.records[q.id] = rec;
    if(se.log[q.id]) se.log[q.id].correct = true;
    saveStore(); saveLast(); render(); toast('已标为答对'); return;
  }
  if(act==='prev'){
    if(!se) return;
    if(se.idx>0){ se.idx--; saveLast(); render(); window.scrollTo(0,0); }
    return;
  }
  if(act==='next'){
    if(!se) return;
    if(se.idx >= se.ids.length-1){
      var s2 = stats();
      toast('本轮练习完成，已练 '+s2.done+' / '+s2.total+' 题');
      go('home');
    } else {
      se.idx++; saveLast(); render(); window.scrollTo(0,0);
    }
    return;
  }
  if(act==='practice-ids'){
    var kind = el.getAttribute('data-kind');
    var mode2 = el.getAttribute('data-mode');
    var rows = [];
    QUESTIONS.forEach(function(q2){
      if(kind==='wrong'){ var vv = verdictOf(q2.id); if(vv==='wrong'||vv==='fuzzy'||vv==='unknown') rows.push(q2); }
      else if(isFav(q2.id)) rows.push(q2);
    });
    startSession(rows, (kind==='wrong'?'错题重练':'收藏重练') + (mode2==='rand'?'（随机）':'（顺序）'), mode2==='rand');
    return;
  }
  if(act==='open-q'){
    var id = el.getAttribute('data-id');
    var qq = BY_ID[id]; if(!qq) return;
    startSession([qq], '单题浏览 · ID '+id, false);
    return;
  }
  if(act==='import'){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(!f){ inp.remove(); return; }
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var d = JSON.parse(fr.result);
          var n = 0, recs = d.records || {};
          for(var k in recs){
            var old = store.records[k];
            if(!old || (recs[k].lastTs||0) > (old.lastTs||0)){ store.records[k] = recs[k]; n++; }
          }
          (d.favs||[]).forEach(function(id){ if(store.favs.indexOf(String(id))<0) store.favs.push(String(id)); });
          saveStore(); toast('已导入 ' + n + ' 条答题记录');
        }catch(err){ toast('文件格式不正确，未导入'); }
        inp.remove(); go('me');
      };
      fr.readAsText(f);
    };
    inp.click(); return;
  }
  if(act==='export'){
    try{
      var blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), records:store.records, favs:store.favs }, null, 1)], { type:'application/json' });
      var a2 = document.createElement('a');
      a2.href = URL.createObjectURL(blob);
      a2.download = '刷题记录-' + todayKey() + '.json';
      document.body.appendChild(a2); a2.click(); a2.remove();
      toast('已导出记录文件');
    }catch(err){ toast('导出失败，可长按页面截图备份'); }
    return;
  }
  if(act==='reset'){
    if(confirm('确定清空全部答题记录和收藏吗？此操作不可恢复。')){
      store = JSON.parse(JSON.stringify(defStore)); saveStore(); pendingMulti={};
      toast('记录已清空'); go('home');
    }
    return;
  }
});

function scrollFeedback(){
  var fb = document.querySelector('.feedback');
  if(fb){ fb.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
function showSelfButtons(){}

window.addEventListener('beforeunload', function(){ if(state.session) saveLast(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden && state.session) saveLast(); });

render();
})();
</script>
